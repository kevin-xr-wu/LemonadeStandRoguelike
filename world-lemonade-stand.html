<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The game has one fixed sunny palette. Declaring it light-only keeps
     phone browsers and webviews in dark mode from auto-darkening the page,
     which used to wash out or hide text on phones. -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5b301">
<title>World Lemonade Stand</title>
<style>
:root{
  color-scheme:light; /* fixed light palette: opt out of browser auto-darkening (see meta above) */
  --ink:#2b2118; --paper:#fff7e0; --paper2:#ffedb8; --lemon:#ffd83d; --lemon2:#f5b301;
  --green:#58b368; --green2:#2e7d46; --red:#e4572e; --blue:#4aa3df; --blue2:#3f7ea8;
  --card:#fffdf4; --radius:16px;
  /* Type: Jersey 15, a pixel face, for headings, buttons and numbers; Nunito for reading. Both are embedded (see the @font-face block). */
  --font-display:"Jersey 15","Nunito","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  /* Every font size comes from this scale. */
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:20px; --fs-xl:28px; --fs-2xl:40px; --fs-3xl:64px;
}
/* Three surface levels, so the eye can tell what to press:
   1. Page surfaces (.panel, .scene, .supShelf, .board, .modal): a fill and rounded corners. No ink border, no hard shadow.
   2. Grouped content (My Stand, slots, chips, pills, hints, banners, callouts, the log, the buy drawer): a flat fill, no border.
   3. Things you press (.btn, .iconBtn, .choice, .item, .cube, .stepper button, .post): the chunky ink border and offset shadow,
      which collapse when pressed. Nothing else gets that look. */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font-body);font-size:var(--fs-md);background:var(--lemon2);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
/* The display face: headings, buttons, signs and every number the player reads at a glance. Hints and descriptions stay in the body face. */
h1,h2,h3,.btn,.helpBtn,.mLbl,.choice .ttl,.artAmt,.hud .money,.calPage,.dayOf,.fcMain,.dayStats b,.standSign,.postFace,.item .n,.stepper b,.pName,#guessText b,
.rHead,.amt,.rTotal,.rStamp,.scoreLabel,.scoreBig,.highlights b{font-family:var(--font-display)}
.mLbl small{font-family:var(--font-body)}
#app{max-width:1060px;margin:0 auto;padding:12px 12px 40px}
#screen{overflow-x:clip} /* pop-in animations start oversized; never let them scroll the page sideways */
/* HUD: a coin counter, a calendar page and a star meter on one dark bar. Icons are art pixels times --px. */
.hud{--px:2;display:flex;align-items:center;gap:24px;position:sticky;top:8px;z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:6px 8px 6px 12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hudIcon{display:block;flex:none;width:calc(16px*var(--px));height:calc(16px*var(--px));background:var(--hudPng) 0 0/calc(86px*var(--px)) calc(16px*var(--px)) no-repeat;image-rendering:pixelated}
.hudCoins,.hudDay{display:flex;align-items:center;gap:8px}
.hud .money{font-size:var(--fs-xl);font-weight:900;line-height:1;color:var(--lemon);font-variant-numeric:tabular-nums}
.hud .money.neg{color:#ff8f6b}
.hudCoins.up .money{animation:cashUp .45s}
.hudCoins.down .money{animation:cashDown .45s}
.hudCoins.up .hudIcon,.hudCoins.down .hudIcon{animation:coinBump .3s}
@keyframes cashUp{from{color:#9be15d}}
@keyframes cashDown{from{color:#ff8f6b}}
@keyframes coinBump{40%{translate:0 calc(-2px*var(--px))}}
.calPage{background-position-x:calc(-16px*var(--px));display:flex;align-items:center;justify-content:center;padding-top:calc(5px*var(--px));color:var(--ink);font-size:var(--fs-lg);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.dayOf{font-weight:800;font-size:var(--fs-md);color:var(--paper2)}
.starMeter{display:flex;gap:var(--px)}
.star{position:relative;width:calc(11px*var(--px));height:calc(11px*var(--px));background:var(--hudPng) calc(-75px*var(--px)) 0/calc(86px*var(--px)) calc(16px*var(--px)) no-repeat;image-rendering:pixelated}
.star:after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--f)*var(--px)*1px);background:inherit;background-position-x:calc(-64px*var(--px))} /* --f: art pixels of the star filled in */
.hudBtn{flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:10px;padding:4px;color:inherit}
.hudBtn:hover{background:rgba(255,247,224,.12)}
.hudBtn:focus-visible{outline:3px solid var(--blue)}
#btnSound{margin-left:auto}
.soundBtn .hudIcon{background-position-x:calc(-32px*var(--px))}
.soundBtn.off .hudIcon{background-position-x:calc(-48px*var(--px))}
.helpBtn{width:34px;height:34px;padding:0;border-radius:50%;background:var(--lemon);color:var(--ink);font-size:var(--fs-lg);font-weight:900;box-shadow:inset 0 -3px 0 var(--lemon2)}
.helpBtn:hover{background:#ffe470}
@media (prefers-reduced-motion:reduce){.hudCoins .money,.hudCoins .hudIcon{animation:none!important}}
.iconBtn{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 rgba(43,33,24,.8)}
.iconBtn:active{transform:translateY(2px);box-shadow:none}
/* Panels */
.panel{background:var(--card);border-radius:var(--radius);padding:18px;margin-top:14px;position:relative}
h2{margin:0 0 8px;font-size:var(--fs-xl)}
h3{margin:14px 0 6px;font-size:var(--fs-lg)}
.center{text-align:center}
.muted{opacity:.72}
.small{font-size:var(--fs-sm)}
.big{font-size:var(--fs-lg);font-weight:800}
/* Cards / choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:10px}
.choice{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:13px;text-align:left;box-shadow:0 4px 0 rgba(43,33,24,.85);transition:transform .12s, box-shadow .12s;position:relative;width:100%}
.choice:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 7px 0 rgba(43,33,24,.85)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,24,.85)}
.choice .ttl{font-size:var(--fs-lg);font-weight:900;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.choice .desc{font-size:var(--fs-sm);margin-top:5px;line-height:1.38}
.rar{font-size:var(--fs-xs);font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0;align-self:flex-start}
.rar.common{background:#ead6a8}.rar.rare{background:#d8f2ff}.rar.epic{background:#f28a5b}.rar.legendary{background:var(--lemon)}
/* Pick cards (cardHtml): the ink border, then a frame in the card's colour, an art window and a white body.
   Upgrades: the frame is the rarity (tan, blue, red, gold); epic and legendary get Pixelwright corner caps, legendary a shine.
   Flavors sit on a chalkboard in a wood frame; cash is a coin pile on green. Art pixels are --px screen pixels. */
.choice.pick{--px:3;--frame:#c9a77a;--artBg:#fff7e0;display:flex;flex-direction:column;gap:6px;padding:7px;background:var(--frame)}
.pick.rare{--frame:#3f7ea8;--artBg:#d8f2ff}
.pick.epic{--frame:#c23b2e;--artBg:#fbd5b0}
.pick.legendary{--frame:#f5b301;--artBg:#fff3a0}
.pick.flavor{--frame:#a86a3a;--artBg:#2f3b33}
.pick.cash{--frame:#2e7d46;--artBg:#9be08a}
.pick.crate{--artBg:#7fc4e8}
.cardArt{position:relative;display:flex;align-items:center;justify-content:center;gap:4px 10px;min-height:calc(24px*var(--px) + 12px);padding:6px;background:var(--artBg);border-radius:8px;overflow:hidden}
.cardArt .icon{--sz:calc(16px*var(--px));vertical-align:0;filter:drop-shadow(0 calc(var(--px)*1px) 0 rgba(43,33,24,.25))}
.cardBody{flex:1;display:block;background:#fff;border-radius:8px;padding:8px 10px 12px}
.pick .ttl{display:block;line-height:1.2}
.pick .desc{display:block}
.pick:disabled{cursor:default;color:var(--ink)} /* the crate being opened keeps its ink text */
.pick.flavor .cardArt{flex-direction:column}
.artTags{display:flex;flex-wrap:wrap;justify-content:center}
.coinPile,.crateArt{display:block;flex:none;image-rendering:pixelated;filter:drop-shadow(0 calc(var(--px)*1px) 0 rgba(43,33,24,.25))}
.coinPile{width:calc(28px*var(--px));height:calc(18px*var(--px));background:var(--coinPilePng) 0 0/100% 100%}
.artAmt{font-size:var(--fs-xl);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.crateArt{width:calc(32px*var(--px));height:calc(30px*var(--px));background:var(--cratesPng) calc(var(--i)*-32px*var(--px)) 0/calc(96px*var(--px)) 100% no-repeat}
.orn{position:absolute;width:calc(11px*var(--px));height:calc(11px*var(--px));background:var(--ornamentsPng) 0 0/calc(99px*var(--px)) 100% no-repeat;image-rendering:pixelated;pointer-events:none}
.orn.tl{top:-3px;left:-3px}.orn.tr{top:-3px;right:-3px}.orn.bl{bottom:-3px;left:-3px}.orn.br{bottom:-3px;right:-3px}
.orn.tr{background-position-x:calc(-11px*var(--px))}.orn.bl{background-position-x:calc(-22px*var(--px))}.orn.br{background-position-x:calc(-33px*var(--px))}
.legendary .orn.tl{background-position-x:calc(-44px*var(--px))}.legendary .orn.tr{background-position-x:calc(-55px*var(--px))}
.legendary .orn.bl{background-position-x:calc(-66px*var(--px))}.legendary .orn.br{background-position-x:calc(-77px*var(--px))}
.pick.legendary .cardArt:after{content:"";position:absolute;top:-10px;bottom:-10px;left:-30%;width:16%;background:rgba(255,255,255,.65);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-30%}100%{left:120%}}
/* Swap screen: the upgrade marked to go turns grey under a red X and stays pressed in */
.outMark{display:none;position:absolute;left:50%;top:50%;z-index:1;width:calc(11px*var(--px));height:calc(11px*var(--px));margin:calc(-5.5px*var(--px));background:var(--ornamentsPng) calc(-88px*var(--px)) 0/calc(99px*var(--px)) 100% no-repeat;image-rendering:pixelated}
.choice.pick.out{--frame:#938e99;--artBg:#cbc7cf;transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,24,.85)}
.pick.out .outMark{display:block}
.pick.out .cardArt>:not(.outMark),.pick.out .cardBody,.pick.out .orn{opacity:.5;filter:grayscale(1)}
/* Crates: the one you pick shakes, the others step back; then the cards flip in, one after another */
.pick.crate.opening .crateArt{animation:crateShake .56s ease-out}
.pick.crate.passed{opacity:.45;transition:opacity .2s}
@keyframes crateShake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg) translateY(-4px)}80%{transform:translateY(-10px) scale(1.06)}}
.pick.flipIn{animation:flipIn .45s ease-out calc(var(--k)*.13s) backwards}
@keyframes flipIn{from{transform:perspective(700px) rotateY(-90deg);opacity:.4}}
@media (prefers-reduced-motion:reduce){.pick.flipIn,.pick.crate.opening .crateArt{animation:none}.pick.legendary .cardArt:after{display:none}}
/* New combo: the flavors that make it, on small chalkboards */
.comboCups{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:2px 0 10px}
.comboCup{display:inline-flex;flex-direction:column;align-items:center;gap:4px;background:#2f3b33;box-shadow:inset 0 0 0 4px #a86a3a;border-radius:10px;padding:10px 12px 8px}
.comboCup .icon{--sz:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap} /* read aloud, not shown */
.tag{display:inline-block;background:var(--paper2);border-radius:99px;font-size:var(--fs-xs);font-weight:800;padding:2px 8px;margin:2px 2px 0 0}
.warn{color:var(--red);font-weight:800}
/* Buttons */
.btn{display:inline-block;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:13px 26px;font-size:var(--fs-lg);font-weight:900;box-shadow:0 5px 0 rgba(43,33,24,.9);transition:transform .1s,box-shadow .1s;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(43,33,24,.9)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,24,.9)}
.btn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed;transform:none}
.btn.gold{background:var(--lemon);color:var(--ink);text-shadow:none}
.btn.blue{background:var(--blue2)} .btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
.btn.sm{padding:8px 14px;font-size:var(--fs-sm);border-radius:11px}
/* Scene */
.scene{border-radius:var(--radius);overflow:hidden;margin-top:14px;position:relative}
.sky{--px:2;height:230px;position:relative;transition:background 1s;overflow:hidden} /* --px: screen pixels per art pixel */
.sky.sunny,.sky.perfect,.sky.windy{background:#7fc4e8}
.sky.hot{background:#fff3a0}
.sky.cloudy{background:#93a9bd}
.sky.rainy{background:#5f7d99}
.ground{height:64px;background:#8a6b46 var(--groundPng) 0 0/128px 64px;position:relative;z-index:3;image-rendering:pixelated}
.ground:before{content:"";position:absolute;top:-18px;left:0;right:0;height:28px;background:var(--grassPng) 0 0/128px 28px repeat-x;image-rendering:pixelated}
/* Street and weather art, drawn in Pixelwright. Sizes are art pixels times --px. The grass edge covers the street's bottom rows. */
.wx{position:absolute;display:block;image-rendering:pixelated;pointer-events:none;background:no-repeat 0 0/100% 100%}
.street{left:0;right:0;bottom:0;height:calc(56px*var(--px));background:var(--streetPng) 50% 100%/calc(256px*var(--px)) 100% repeat-x;z-index:2}
.sun{top:calc(4px*var(--px));right:calc(6px*var(--px));width:calc(29px*var(--px));height:calc(29px*var(--px));background-image:var(--sunPng);z-index:1}
.sun.hot{top:calc(2px*var(--px));right:calc(4px*var(--px));width:calc(33px*var(--px));height:calc(33px*var(--px));background-image:var(--hotSunPng)}
.rainbow{left:calc(4px*var(--px));bottom:calc(14px*var(--px));width:calc(120px*var(--px));height:calc(60px*var(--px));background-image:var(--rainbowPng);z-index:1}
.cloud{top:calc(var(--y)*var(--px)*1px);width:calc(40px*var(--px));height:calc(16px*var(--px));background-image:var(--cloudPng);z-index:1;animation:drift linear infinite}
.cloud.dark{background-image:var(--rainCloudPng)}
.wx.flip{transform:scaleX(-1)}
.rain{inset:0;background:var(--rainPng) 0 0/calc(32px*var(--px)) calc(32px*var(--px));z-index:4;animation:rainFall .4s steps(8) infinite}
.gust{bottom:calc(var(--b)*var(--px)*1px);width:calc(48px*var(--px));height:calc(12px*var(--px));background-image:var(--gustPng);z-index:4;animation:blowBy 2.8s linear infinite}
.leaf{bottom:calc(var(--b)*var(--px)*1px);width:calc(9px*var(--px));height:calc(7px*var(--px));background-image:var(--leafPng);z-index:4;animation:blowBy 3.6s linear infinite,leafSpin .6s steps(4) infinite,leafBob 1.1s ease-in-out infinite alternate}
.shimmer{bottom:calc(var(--b)*var(--px)*1px);width:calc(11px*var(--px));height:calc(20px*var(--px));background-image:var(--shimmerPng);z-index:4;opacity:.8;animation:shimmer 2.5s ease-out infinite}
@keyframes drift{from{left:-20%}to{left:110%}}
@keyframes rainFall{to{background-position:0 calc(32px*var(--px))}}
@keyframes blowBy{0%{left:-12%;opacity:0}10%,85%{opacity:1}100%{left:105%;opacity:0}}
@keyframes leafSpin{to{rotate:360deg}}
@keyframes leafBob{to{translate:0 calc(-10px*var(--px))}}
@keyframes shimmer{0%{translate:0 0;opacity:0}30%{opacity:.8}100%{translate:0 calc(-28px*var(--px));opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.rain,.gust,.leaf,.shimmer,.bubble,.coin,.cust.walk,.cust.carry,.flavorPop{animation:none}}
.stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:128px;image-rendering:pixelated;z-index:5;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.standSign{position:absolute;left:50%;bottom:134px;transform:translateX(-50%) rotate(-2deg);background:#fff;border-radius:8px;padding:3px 12px;font-weight:900;font-size:var(--fs-sm);z-index:6;white-space:nowrap}
.crowdMix{position:absolute;top:10px;left:12px;background:rgba(255,253,244,.92);border-radius:10px;padding:5px 10px;font-size:var(--fs-xs);font-weight:700;z-index:6;max-width:46%;line-height:1.5}
/* Customers: --fw is the frame width in sprite pixels, --s the scale. left is the centre of the feet. */
.cust{--s:2;position:absolute;bottom:2px;width:calc(var(--fw)*var(--s)*1px);height:calc(var(--s)*32px);margin-left:calc(var(--fw)*var(--s)*-.5px);background:no-repeat 0 0/calc(var(--fw)*var(--s)*8px) 100%;image-rendering:pixelated;z-index:6;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.cust.left{transform:scaleX(-1)} /* the walk sheets face right */
.cust.walk{animation:custWalk .44s steps(4) infinite}
.cust.carry{animation:custCarry .44s steps(4) infinite}
.cust.front{background-size:100% 100%}
@keyframes custWalk{from{background-position-x:0}to{background-position-x:calc(var(--fw)*var(--s)*-4px)}}
@keyframes custCarry{from{background-position-x:calc(var(--fw)*var(--s)*-4px)}to{background-position-x:calc(var(--fw)*var(--s)*-8px)}}
.bubble{--rise:6px;position:absolute;font-size:var(--fs-xs);font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;z-index:8;animation:floatUp 1.6s ease-out forwards;white-space:nowrap;pointer-events:none}
/* The coin pops up over the head of the customer who paid, spinning. left is its centre. */
/* Pixel-art item icons, drawn in Pixelwright: 16×16 art shown at 16px in text, or 32px with .big. --i is the icon's place on its sheet. */
.icon{--sz:16px;display:inline-block;width:var(--sz);height:var(--sz);vertical-align:-3px;background:no-repeat calc(var(--i)*var(--sz)*-1) 0/calc(var(--n)*var(--sz)) var(--sz);image-rendering:pixelated}
.icon.big{--sz:32px;vertical-align:-9px}
.icon.supply{--n:16;background-image:var(--supplyIcons)}
.icon.flavor{--n:12;background-image:var(--flavorIcons)}
.icon.spot{--n:13;background-image:var(--spotIcons)}
.icon.gearA{--n:20;background-image:var(--gearIconsA)}
.icon.gearB{--n:19;background-image:var(--gearIconsB)}
.coin{--s:2;--rise:28px;position:absolute;bottom:64px;width:calc(var(--s)*10px);height:calc(var(--s)*10px);margin-left:calc(var(--s)*-5px);background:var(--coinPng) 0 0/calc(var(--s)*40px) 100% no-repeat;image-rendering:pixelated;z-index:9;animation:coinFly .8s ease-out forwards,coinSpin .32s steps(4) infinite;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(var(--rise)*-1))}}
@keyframes coinFly{0%{transform:translateY(0)}60%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--rise)*-1))}}
/* What they bought pops up beside the coin: the cup count when it's more than 1, then the flavors' chalkboard icons at the scene's
   pixel size, on a badge like the speech bubbles so it reads in front of the stand. left is the coin's centre; spawnFlavor sets
   margin-left so the badge's right edge sits just left of the coin. */
.flavorPop{position:absolute;bottom:calc(var(--px)*32px);display:flex;align-items:center;gap:calc(var(--px)*1px);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:calc(var(--px)*2px);z-index:9;pointer-events:none;animation:flavorPop 1s ease-out forwards}
.flavorPop b{padding:0 calc(var(--px)*1px);font-size:calc(var(--px)*9px);font-weight:900;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.flavorPop .icon{--sz:calc(16px*var(--px));display:block;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
@keyframes flavorPop{0%{opacity:0;transform:scale(.5)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--px)*-8px))}}
@keyframes coinSpin{to{background-position-x:calc(var(--s)*-40px)}}
/* Day controls live in the scene: Skip and Speed as small corner buttons. */
.sceneBtns{position:absolute;top:10px;right:12px;z-index:7;display:flex;gap:6px}
.sceneBtns .btn{box-shadow:0 2px 0 rgba(43,33,24,.85)}
.dayStats{display:flex;flex-wrap:wrap;gap:8px;background:#2b2118;color:#fff;padding:10px 14px;font-weight:800;font-size:var(--fs-md)}
.dayStats .phaseTxt{color:var(--lemon);margin-right:auto}
.dayStats span b{color:var(--lemon)}
/* Evening report: the day's math is a till receipt, the tip a sticky note */
.pos{color:var(--green2)} .negc{color:var(--red)}
.report{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px 28px;align-items:start}
.receiptBox{max-width:340px;width:100%;justify-self:center}
.receiptWrap{transform:rotate(-.8deg);filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(0 4px 0 rgba(43,33,24,.35))}
.receipt{background:#fff;padding:20px 18px 24px;font-size:var(--fs-md);

          mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/16px 8px repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 16px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}

/* ==================== Full-screen stage: the morning and the selling day ====================
   The scene fills the window. The HUD floats over the sky, and every control is a card standing on the ground,
   so nothing covers the street, the stand or the customers. The ground grows to fit its cards; the sky takes the rest.
   Sprites stay at 2× on phones too: the scene has the room now. */
body:has(.stage){overflow:hidden}
#app:has(.stage) .hud{position:fixed;top:8px;left:12px;right:12px}
.hudWx{display:flex;align-items:baseline;gap:6px;white-space:nowrap;font-size:var(--fs-lg);font-weight:800}
.hudWx b{font-family:var(--font-display);font-weight:400;font-size:var(--fs-xl);line-height:1;color:var(--lemon)}
.hudWx:empty,#app:not(:has(.stage)) .hudWx{display:none} /* only for the morning and the selling day */
.stage{--px:2;--hudH:56px;position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden auto;background:#8a6b46}
.stage .sky{--px:2;flex:1 0 auto;height:auto;display:flex;flex-direction:column;padding:calc(var(--hudH) + 18px) 12px calc(84px*var(--px))}
.stage .ground{flex:none;height:auto;z-index:auto;background-size:calc(64px*var(--px)) calc(32px*var(--px));padding:calc(12px*var(--px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.stage .ground:before{z-index:3;top:calc(-9px*var(--px));height:calc(14px*var(--px));background-size:calc(64px*var(--px)) calc(14px*var(--px))}
.stage .stand{width:calc(64px*var(--px))}
.stage .standSign{bottom:calc(67px*var(--px));font-size:var(--fs-sm);padding:3px 12px}
.stage .cust{--s:var(--px);bottom:calc(1px*var(--px))}
.stage .coin{--s:var(--px);--rise:calc(14px*var(--px));bottom:calc(32px*var(--px))}
.stage .bubble{--rise:calc(3px*var(--px))}
.stage .sun{top:calc(var(--hudH) + 24px)}
.stage .cloud{top:calc(var(--hudH) + var(--y)*var(--px)*1px)}
/* Over the sky: what today is like (left), where you sell (middle), news (under the forecast) */
.skyTop{position:relative;z-index:7;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto) minmax(0,1fr);align-items:start;gap:10px}
.skyTop .side{display:grid;gap:8px;justify-items:start;align-content:start}
.spotCard{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 rgba(43,33,24,.3);width:min(580px,100%);justify-self:center}
.spotCard .postFace{font-size:var(--fs-sm);padding:4px 18px 4px 8px}
.spotCard .mLbl{justify-content:center;margin:0 0 6px;font-size:var(--fs-sm)}
.spotCard .posts{max-width:none}
/* Today's news (events, Lucky Dice, combos, hot streak): one strip of notes just under the HUD */
.news{grid-column:1/-1;justify-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:min(820px,100%);margin-top:-6px}
.news .synBanner,.news .callout{margin:0;border-radius:10px;font-size:var(--fs-xs);font-weight:700;line-height:1.35;padding:4px 10px;box-shadow:0 3px 0 rgba(43,33,24,.25)}
.news .callout{background:var(--card)}
.spotChip{background:rgba(255,253,244,.95);border-radius:12px;padding:6px 12px;font-size:var(--fs-sm);font-weight:800;line-height:1.45;box-shadow:0 4px 0 rgba(43,33,24,.25)}
.toast{justify-self:center;background:var(--card);border-radius:12px;padding:6px 14px;font-size:var(--fs-sm);font-weight:800;box-shadow:0 4px 0 rgba(43,33,24,.3);max-width:min(460px,calc(100vw - 24px));text-align:center;animation:toastLife 4s ease-out forwards}
.toast:empty{display:none}
.toast .good{color:var(--green2)}.toast .bad{color:var(--red)}.toast .info{color:#1c5fa8}
@keyframes toastLife{0%{opacity:0;transform:translateY(-8px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
/* On the ground: the cards you set the day up with, then the day's numbers */
.dockIn{position:relative;z-index:9;max-width:1440px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:12px}
.dock .card{background:var(--card);border-radius:14px;padding:8px 12px 10px;box-shadow:0 4px 0 rgba(43,33,24,.35)}
.dock .mLbl{margin:0 0 6px;font-size:var(--fs-sm)}
.dock .supShelf{position:relative;margin:0;padding:8px 12px 0;overflow:visible;box-shadow:0 5px 0 rgba(43,33,24,.35);max-width:100%}
.dock .shelfRow{display:flex;gap:8px;margin:0 -12px;padding:10px 12px 8px;overflow-x:auto;scrollbar-width:none}
.dock .shelfRow .sep{flex:none;width:3px;border-radius:2px;background:#7a4428;opacity:.5}
.dock .item{flex:none;width:62px}
.dock .drawer{position:absolute;left:0;bottom:calc(100% + 10px);z-index:10;width:min(340px,calc(100vw - 24px));margin:0;box-shadow:0 6px 0 rgba(43,33,24,.3),0 10px 24px rgba(0,0,0,.2)}
.dock .gear{display:flex;gap:18px;align-items:flex-start}
.dock .gear>div+div{margin-top:0}
.dock .cube{padding:2px}
.dock .stepper b{min-width:50px}
/* Today's prices: a chalkboard slide with a price tag per flavor. The tags sit in one row that scrolls sideways,
   so any number of flavors fits without the card growing. */
.slide.board{margin:0;border-radius:0;box-shadow:inset 0 0 0 5px #a86a3a;padding:10px 14px 8px}
.prices{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#a86a3a transparent;padding-bottom:4px}
.spotCard .price{flex:none;width:150px;scroll-snap-align:start;grid-template-columns:auto minmax(0,1fr);grid-template-rows:1fr auto;align-items:start;justify-items:start;gap:4px 8px;text-align:left} /* steppers line up along the bottom */
.spotCard .price .stepper,.spotCard .price .pOut{grid-column:1/-1}
.spotCard .price .stepper,.spotCard .price .pOut{justify-self:center;align-self:center} /* a flavor you cannot make today shows what it needs in place of its price */
.spotCard .price .tag{margin:0}
.spotCard .price>div{min-width:0;max-width:100%}
.spotCard .pName{font-size:var(--fs-sm);line-height:1.15}
.spotCard .pOut{font-size:var(--fs-xs);line-height:1.25}
.spotCard .stepper button{width:34px;height:34px}
.spotCard .stepper b{min-width:50px}
.dock .cubes{flex-wrap:nowrap}
/* The top card is a carousel: "Where today?", "Signs today", "Today's prices", then "Ready to open?" with the cups your supplies make and Open */
.signBuy{display:flex;align-items:center;justify-content:center;gap:12px}
.signBuy .each{font-size:var(--fs-sm);font-weight:800}
.signBuy .each b{font-family:var(--font-display);font-weight:400;font-size:var(--fs-lg)}
.slides{display:flex;transform:translateX(calc(var(--card,0)*-100%));transition:transform .3s ease}
.slide{flex:0 0 100%;min-width:0;padding:8px 10px 2px;display:flex;flex-direction:column;justify-content:center}
.goBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:2px 0 4px}
.goInfo{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.goChip{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border-radius:99px;padding:4px 12px;font-size:var(--fs-sm);font-weight:800;line-height:1.2;white-space:nowrap}
.goChip b{font-family:var(--font-display);font-size:var(--fs-lg);line-height:1;color:var(--green2)}
.goChip .warnTxt{color:var(--red)}
.spotCard #guessText{flex:none;flex-wrap:nowrap;gap:6px;font-size:var(--fs-sm)} /* beats the old guess bar's #guessText rules */
.spotCard #guessText b{color:var(--green2)}
.spotCard #btnOpen{width:min(260px,100%);padding:10px 24px;font-size:var(--fs-xl);margin:0}
.carNav{display:flex;align-items:center;justify-content:center;gap:2px;padding:0 0 4px}
.carNav button{display:flex;align-items:center;justify-content:center;min-width:32px;height:28px;padding:0;background:none;border:0;border-radius:8px;color:var(--ink);font-family:var(--font-display);font-size:var(--fs-xl);line-height:1}
.carNav button:hover{background:var(--paper2)}
.carNav button:focus-visible{outline:3px solid var(--blue)}
.carNav button[aria-disabled="true"]{opacity:.25;cursor:default;background:none}
.carNav .dot{min-width:22px}
.carNav .dot:before{content:"";width:10px;height:10px;border-radius:50%;background:rgba(43,33,24,.25)}
.carNav .dot[aria-current="true"]:before{background:var(--ink)}
@media (prefers-reduced-motion:reduce){.slides{transition:none}}
.dayCard{display:grid;gap:6px;min-width:260px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px 12px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.dayCard #dayMsg{font-weight:800;color:var(--lemon)}
.dayBar{position:relative;height:10px;border-radius:99px;background:rgba(255,247,224,.2);overflow:hidden}
.dayBar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--lemon);transition:width .3s}
.dayBar:after{content:"";position:absolute;left:55%;top:0;bottom:0;width:2px;background:var(--ink)} /* noon */
.statChip{display:grid;justify-items:center;min-width:92px;background:var(--ink);color:#fff;border-radius:14px;padding:7px 14px 9px;box-shadow:0 5px 0 rgba(0,0,0,.25);font-size:var(--fs-sm);font-weight:800}
.statChip b{font-family:var(--font-display);font-size:var(--fs-xl);line-height:1;color:var(--lemon);font-variant-numeric:tabular-nums}
.dayBtns{display:flex;gap:8px}
.dayBtns .btn{box-shadow:0 4px 0 rgba(43,33,24,.85)}
/* The HUD's upgrade tray: your five slots, always in view. Tap it to see them all. On phones the slots shrink to pips. */
.hudTray{display:flex;align-items:center;gap:4px;background:none;border:0;border-radius:10px;padding:4px;color:inherit}
.hudTray:hover{background:rgba(255,247,224,.12)}
.hudTray:focus-visible{outline:3px solid var(--blue)}
.tSlot{width:38px;height:38px;border-radius:8px;background:rgba(255,247,224,.16);display:flex;align-items:center;justify-content:center}
.tSlot.empty{background:none;border:2px dashed rgba(255,247,224,.3)}
.tSlot .icon{--sz:32px;vertical-align:0}
.dockTabs{display:none}
.starNum{display:none}
@media (min-width:901px){ /* wide screens: every morning card in one row on the ground */
  .morning .dockIn{flex-wrap:nowrap;align-items:stretch}
  .morning #mShop{flex:0 1 auto;min-width:230px}
  .morning #mGear{flex:none;flex-direction:column;gap:8px}
  .dock .gear .learn{display:block;width:max-content;margin-top:6px}
}
/* When the stand opens, the camera moves in: the selling day draws the scene at 3× on big screens */
@media (min-width:900px) and (min-height:720px){.stage.day,.stage.day .sky{--px:3}.stage .ground{min-height:max(190px,26vh)}}
@media (min-width:900px) and (min-height:940px){.stage,.stage .sky{--px:3}}
@media (max-width:900px){ /* narrower screens: the ground shows one group of morning controls at a time */
  .dockTabs{display:flex;flex:1 1 100%;gap:4px;background:var(--ink);border-radius:14px;padding:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .dockTabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;background:none;border:0;border-radius:10px;color:#fff;font-family:var(--font-display);font-size:var(--fs-md);padding:4px 6px}
  .dockTabs button[aria-selected="true"]{background:var(--lemon);color:var(--ink)}
  .dock[data-tab="shop"] #mGear,.dock[data-tab="gear"] #mShop{display:none}
  .dock .supShelf>.mLbl{display:none} /* the tab already names it */
  .dock .supShelf{padding-top:2px}
  .dockIn{gap:10px}
  .dock .supShelf,.dock .gear{flex:1 1 100%}
  .dock .shelfRow{justify-content:space-between}
  .dock .gear{justify-content:space-between}
  .spotCard .price{width:140px}
  .dock .stepper button{width:34px;height:34px}
  .dock .stepper b{min-width:46px;font-size:var(--fs-md)}
  .dockTabs{order:2} /* tabs sit under the cards, so a buy popover never covers them */
}
@media (max-width:1100px){
  .stage{--hudH:84px}
  #app:has(.stage) .hud{flex-wrap:wrap;row-gap:2px}
  .hudWx{order:10;flex:1 1 100%;justify-content:center;border-top:1px solid rgba(255,247,224,.15);padding:4px 0 2px}
  .hudWx b{font-size:var(--fs-lg)}
}
@media (max-width:720px){
  .stage{--hudH:80px}
  .skyTop{grid-template-columns:1fr;justify-items:stretch}
  .skyTop .side{justify-items:start}
  .spotCard .slide{padding:6px 8px 2px}
  .spotCard .postFace{padding:5px 15px 5px 6px;font-size:var(--fs-xs)}
  .spotCard{justify-self:center}
  .spotChip{justify-self:start}
  .dock .item{width:62px}
  .stage .ground{min-height:max(250px,32vh)}
  .dayCard{grid-template-columns:1fr auto;align-items:center;min-width:0}
  .dayCard .dayBar{grid-column:1}
  .dayCard .dayBtns{grid-column:2;grid-row:1/3}
  .dayCard,.statChip{flex:1 1 100%}
  .statChip{flex:1;min-width:0;padding:6px 8px 8px}
  .hudTray{gap:3px;padding:6px 4px}
  .tSlot{width:10px;height:10px;border-radius:3px;background:var(--lemon)}
  .tSlot.empty{background:none;border:2px solid rgba(255,247,224,.4)}
  .tSlot .icon{display:none}
}
@media (max-width:560px){ /* phones: the star meter becomes one star and the number, to make room for the upgrade tray */
  .hud{gap:10px}
  .starMeter .star:nth-child(n+2){display:none}
  .starMeter{align-items:center;gap:4px}
  .starNum{display:block;font-family:var(--font-display);font-size:var(--fs-lg);color:var(--lemon);line-height:1}
}
/* The stage never scrolls. When it is taller than the window, fitStage() adds these one at a time until it fits:
   tighter spacing, no first-day hints, then smaller sprites, so the scene stays big as long as it can. */
.stage.fit-tight .ground{min-height:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.stage.fit-tight .sky{padding-top:calc(var(--hudH) + 10px)}
.stage.fit-tight .skyTop{gap:6px}
.stage.fit-tight .spotCard .slide{padding-top:6px}
.stage.fit-tight .carNav{padding-bottom:2px}
.stage.fit-tight .carNav button{height:22px}
.stage.fit-tight .spotCard .mLbl{display:none}
.stage.fit-tight .dockIn{gap:8px}
.stage.fit-tight .dock .mLbl{margin-bottom:2px}
.stage.fit-px2,.stage.fit-px2 .sky{--px:2}
.stage.fit-min .learn{display:none}
.stage.fit-min .spotCard .pName{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.fit-min .slide.board{padding:6px 12px}
.stage.fit-min .dockTabs button{min-height:34px}
.stage.fit-min .news>*{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage.fit-px1,.stage.fit-px1 .sky{--px:1}
</style>

/* ---------- celebrations, sized to the moment ----------
   Opening a crate is small: a sound (openCrate). A perfect day or a new combo is medium: a sound and a handful of
   lemons and coins. Finishing the summer is big: the fanfare and a fountain of them. Each fires once, from the thing
   being celebrated, after `wait` ms so it lands with that thing's own animation. Reduced motion keeps the sound only. */
const stillMotion=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function celebrate(size,el,wait=0){
  setTimeout(()=>{
    if(!el||!el.isConnected)return; // the player has already moved on
    if(size==="big")sfx.fanfare();else sfx.good();
    burst(el,size==="big"?18:8);
  },stillMotion()?0:wait);
}
function burst(el,n){
  if(stillMotion())return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,big=n>10;
  const lift=clamp((y-16)/(big?150:95),.3,1); // near the top of the screen, lower arcs so nothing flies off it
  for(let i=0;i<n;i++){
    const b=document.createElement("i");b.className="bit "+(i%3?"coinBit":"lemonBit");b.setAttribute("aria-hidden","true");
    b.style.left=x+"px";b.style.top=y+"px";document.body.appendChild(b);
    // a fixed fan, no Math.random: pieces alternate sides, each pair lands wider, and peak heights cycle
    const side=i%2?1:-1,dx=side*((i>>1)+1)*(big?34:36),up=lift*(big?[130,95,150,80,115]:[80,60,95,50])[i%(big?5:4)],fall=big?240:140;
    const v=2*up+2*Math.sqrt(up*up+up*fall),g=v+fall; // y(p)=g·p²−v·p rises `up` px, then ends `fall` px below the start
    const frames=[];for(let k=0;k<=12;k++){const p=k/12;frames.push({transform:`translate(${Math.round(dx*p)}px,${Math.round(g*p*p-v*p)}px)`,opacity:p?Math.min(1,(1-p)*4):0})} // hidden until it leaves, fades out over the last quarter
    b.animate(frames,{duration:big?1500:1100,delay:i*(big?30:20),fill:"backwards"}).onfinish=()=>b.remove();
  }
}

/* ---------- money count-up: a total counts up from $0 as coins drop in; reduced motion shows it at once ---------- */
function countUp(el,to){
  if(!el)return;
  if(to<=0||stillMotion()){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=1100;el.textContent=fmt(0);
  const step=t=>{if(!el.isConnected)return;const p=Math.min(1,(t-t0)/dur);
    el.textContent=fmt(p<1?Math.floor(to*(1-Math.pow(1-p,3))*100)/100:to);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  [-22,12,-6,20,2].forEach((x,i)=>{ // fixed spots: Math.random stays the game's alone
    const c=document.createElement("span");c.className="dropCoin";c.style.left=`calc(50% + ${x}px)`;c.style.animationDelay=i*0.2+"s";
    el.parentNode.appendChild(c);setTimeout(()=>{c.remove();if(el.isConnected)sfx.coin(i*4)},i*200+500);
  });
}

/* setTimeout that runs on simulation time: after(800) fires after 800ms
   of scaled time, so a mid-wait speed toggle stretches/shrinks it too. */
function after(ms,fn){

  const iv=setInterval(()=>{
    const now=performance.now();acc+=(now-last)*SPEED;last=now;
    if(acc>=ms){clearInterval(iv);fn()}
  },40);
  return iv;
}

/* b.tags = flavor tags on your menu's recipes (feeds synergies). Gear carries no tags. */
function computeBuild(){
  const b={tags:{},drink:{},demandMult:1,tipMult:1,payMult:1,signMult:1,freeSigns:0,synergies:[]};
  const addTag=(t,n=1)=>{b.tags[t]=(b.tags[t]||0)+n};
  const addDrink=(t,n=1)=>{b.drink[t]=(b.drink[t]||0)+n;addTag(t,n)};
  S.recipes.forEach(rk=>RECIPES[rk].tags.forEach(t=>addDrink(t))); // the menu is everything you can pour
  // gear direct effects (demand/tips/signs — production handled elsewhere)
  if(S.gear.includes("mega"))b.signMult*=1.4;
  if(S.gear.includes("brother"))b.freeSigns+=2;
  if(S.gear.includes("painted"))b.freeSigns+=3;
  if(S.gear.includes("secondcart"))b.demandMult*=1.3;
  if(S.gear.includes("mascot"))b.demandMult*=1.25;
  if(S.gear.includes("passport"))b.demandMult*=1+0.04*new Set(S.recipes.map(rk=>RECIPES[rk].origin.split(" · ")[0])).size;
  if(S.gear.includes("franchiseflag"))b.demandMult*=Math.pow(1.07,S.gear.length); // worth more with every slot you fill
  if(S.gear.includes("tipjar"))b.tipMult*=3;
  // synergies
  SYNERGIES.forEach(syn=>{if(syn.check(b)){b.synergies.push(syn);
    if(syn.id==="fullhouse"){b.demandMult*=1.15;b.tipMult*=1.15}
  }});
  b.activeSynergies=b.synergies.map(s=>s.id);
  return b;
}
function flavorTagSet(rk){return new Set(RECIPES[rk].tags)}
/* How much one crowd likes ONE flavor: their loved tags on it, their hated tag, and today's Special. */
function appealFor(crowdKey,rk,b){
  const c=CROWDS[crowdKey];const ft=flavorTagSet(rk);let a=1.0;
  c.loves.forEach(t=>{if(ft.has(t))a+=0.28});
  if(c.hates&&ft.has(c.hates)&&!(S.gear.includes("honeypot")&&c.hates==="SWEET"))a-=0.3;
  if(S.gear.includes("honeypot")&&ft.has("SWEET")&&c.loves.includes("FANCY"))a+=0.28;
  if(S.gear.includes("special")&&M&&M.special===rk)a+=0.3;
  return clamp(a,0.4,2.2);
}
function crowdAppeal(crowdKey,b){ // menu-level: their favorite flavor on your menu
  let best=0.4;S.recipes.forEach(rk=>{best=Math.max(best,appealFor(crowdKey,rk,b))});
  return best;
}
/* What each crowd will pay depends on the sky: heat loosens wallets, rain tightens them. */
const WX_PAY={sunny:1,hot:1.2,perfect:1.25,cloudy:0.95,rainy:0.9,windy:1};
function payWillingness(crowdKey,b,wxKey){
  let p=CROWDS[crowdKey].pay*(WX_PAY[wxKey]||1);
  if(S.gear.includes("lemonzest"))p*=1.15;
  if(S.gear.includes("plaque")&&S.rep>=4.5)p*=1.2;
  if(S.gear.includes("shavedice")&&M)p*=1+0.05*Math.min(3,Math.max(0,M.icePerCup-iceMinToday()));
  if(b.activeSynergies.includes("palate")&&["parents","tourists","foodies"].includes(crowdKey))p*=1.3;
  if(b.activeSynergies.includes("goldenhour"))p*=1.2;
  return p;
}
/* Buy rate vs price: gentle gains below a crowd's willingness, a steep cliff above it.
   Revenue from each crowd peaks at its willingness, so the best price depends on WHO is at your spot. */
function priceFactor(pay,p){
  const r=pay/Math.max(p,0.25);
  return r>=1?Math.min(1.6,Math.pow(r,0.6)):Math.max(0.02,Math.pow(r,3));
}

function genMorning(){
  const act=actIndex();
  // weather roll (deck-ish weights, act 2+ wilder)
  const wlist=Object.entries(WEATHERS).map(([k,v])=>({k,w:v.w*(k==="perfect"?1:act>=1&&["rainy","windy","cloudy"].includes(k)?1.25:1)}));
  const trueWx=sampleWeighted(wlist).k;
  // the forecast is always right: shown weather IS the day's weather
  const shownWx=trueWx;
  // locations: 3 distinct
  const locs=shuffle(LOCATIONS).slice(0,S.gear.includes("map")?4:3).map(l=>{
    let traffic=Math.round(l.traffic*trafficScale(act)*rnd(0.9,1.1));
    return {...l,traffic};
  });
  // crowd mix for a location computed on selection
  const gv=S.gear.includes("grapevine"); // Town Grapevine: good news travels, bad news stalls
  const evRoll=sampleWeighted(EVENTS.map(e=>({k:e.id,w:e.w*(gv?(GOOD_EVENTS.includes(e.id)?2:BAD_EVENTS.includes(e.id)?0.5:1):1)}))).k;
  const ev=EVENTS.find(e=>e.id===evRoll);
  const prices={};S.recipes.forEach(rk=>{prices[rk]=S.menuPrices[rk]!=null?S.menuPrices[rk]:RECIPES[rk].price});
  const temp=ri(...WX_TEMP[trueWx]);
  M={trueWx,shownWx,temp,locs,loc:null,tab:"shop",card:0,event:ev,signs:0,icePerCup:(S.last?S.last.ice:2),prices,logStart:S.log.length,
     special:S.gear.includes("special")?pick(S.recipes):null,
     dice:S.gear.includes("dice")?Math.round(rnd(0.7,1.6)*100)/100:0};
  if(S.gear.includes("lemontree")){S.treeDays=(S.treeDays||0)+1;M.treeLemons=5+S.treeDays;addStock("lemons",M.treeLemons,0)}
  S.todayCostMult=S.tomorrowCostMult||1;S.tomorrowCostMult=1;
  if(ev.fn)ev.fn(S);
}
function crowdMixFor(loc){
  // base mix + location bias -> exact %
  const base={kids:18,parents:18,athletes:15,tourists:10,foodies:8,artists:11};
  const act=actIndex();
  if(act>=2)base.tourists+=7; if(act>=3){base.tourists+=9;base.foodies+=3;base.kids-=3}
  Object.entries(loc.bias).forEach(([k,v])=>{base[k]=(base[k]||0)+v*3});
  if(loc.name==="Boardwalk")base.tourists+=8;
  let tot=Object.values(base).reduce((a,b)=>a+b,0);
  const magnets={sponsor:"athletes",tourbus:"tourists",foodblog:"foodies"}; // ~+10 points of that crowd each
  Object.entries(magnets).forEach(([g,ck])=>{if(S.gear.includes(g))base[ck]+=tot*0.13});
  tot=Object.values(base).reduce((a,b)=>a+b,0);
  const mix={};Object.entries(base).forEach(([k,v])=>mix[k]=Math.round(v/tot*100));
  return mix;
}
function demandEstimate(loc,signs,opts={}){
  const b=computeBuild(),menu=opts.menu||S.recipes;
  const useWx=opts.wx||M.shownWx;
  let wxMult=WEATHERS[useWx].mult;
  if(S.gear.includes("sunhat")&&useWx==="sunny")wxMult=WEATHERS.hot.mult;
  if(S.gear.includes("icecrush")&&(useWx==="hot"||useWx==="perfect"))wxMult*=1.25;
  if(b.activeSynergies.includes("coldsnap")&&(useWx==="hot"||useWx==="perfect"))wxMult*=1.45;
  if(S.gear.includes("ponchos")&&useWx==="rainy")wxMult*=1.6;
  if(S.gear.includes("awning")&&(useWx==="cloudy"||useWx==="rainy"))wxMult*=1.25;
  const mix=crowdMixFor(loc);
  let trafficBase=loc.traffic;
  const repMult=(0.7+(S.rep-1)*0.2)*(S.gear.includes("loyalty")? (0.7+(S.rep-1)*0.4)/ (0.7+(S.rep-1)*0.2):1);
  const effSigns=signs+b.freeSigns;
  let signBonus;
  if(S.gear.includes("bigsign"))signBonus=1+0.10*effSigns*b.signMult;
  else signBonus=1+0.16*Math.sqrt(Math.max(effSigns,0))*b.signMult;
  // per crowd: their best flavor drives whether they come; ALL flavors share the split by preference
  let weighted=0,baseShare=0;const split={};
  Object.entries(mix).forEach(([ck,pct])=>{
    let share=pct/100; baseShare+=share;
    if(ck==="kids"&&b.activeSynergies.includes("sugarrush"))share*=1.8; // extra kids ON TOP of the crowd
    let best=0,sumT=0;const tw={};
    menu.forEach(rk=>{
      const price=opts.prices?opts.prices[rk]:menuPrice(rk);
      let pf=priceFactor(payWillingness(ck,b,useWx),price);
      if(S.gear.includes("pricetag")&&(Math.abs(price%1)<0.01||Math.abs(price%1-0.5)<0.01))pf*=1.1;
      best=Math.max(best,appealFor(ck,rk,b)*pf*RECIPES[rk].appeal);
      const ap=appealFor(ck,rk,b); tw[rk]=ap*ap*ap*RECIPES[rk].appeal; sumT+=tw[rk];
    });
    weighted+=share*best;
    menu.forEach(rk=>{split[rk]=(split[rk]||0)+share*(sumT>0?tw[rk]/sumT:0)});
  });
  const priceAppeal=weighted/Math.max(baseShare,0.01);
  let demand=trafficBase*repMult*wxMult*signBonus*priceAppeal*b.demandMult*iceAccept();
  if(S.gear.includes("chalkmenu")&&menu.every(rk=>menuPrice(rk)>=3))demand*=1.2;
  if(S.gear.includes("thermo"))demand*=clamp(1+0.02*(M.temp-75),0.6,1.8);
  if(M.dice)demand*=M.dice;
  if(M.event&&M.event.id==="closure")demand*=0.35;
  if(M.event&&M.event.id==="heatwave")demand*=1.5;
  if(M.event&&M.event.id==="bees")demand*=0.8;
  if(M.event&&M.event.id==="puppy")demand*=1.15;
  if(M.event&&M.event.id==="newspaper")demand*=1.2;
  if(M.event&&M.event.id==="birthday")demand*=1.25;
  if(M.event&&M.event.id==="foodtruck")demand*=1.2;
  const minPrice=Math.min(...menu.map(rk=>menuPrice(rk)));
  const crew=!opts.noCrew&&M.event&&M.event.id==="crewbuy"&&minPrice<=CREW_MAX_PRICE+1e-9?crewSize():0;
  return {demand:Math.max(0,Math.round(demand))+crew,crew,wxMult,signBonus,priceAppeal,repMult,split};
}

/* The HUD's money counts to each new amount, so buying and selling feel like coins changing hands. */
const hudCash={shown:null,raf:0};
function showCash(to){
  const el=$("#hudCash"),box=$("#hudMoney"),from=hudCash.shown;
  el.classList.toggle("neg",to<5);
  if(from===to)return;
  cancelAnimationFrame(hudCash.raf);
  if(from===null||matchMedia("(prefers-reduced-motion:reduce)").matches){hudCash.shown=to;el.textContent=fmt(to);return}
  box.classList.remove("up","down");void box.offsetWidth;box.classList.add(to>from?"up":"down"); // restart the flash
  const whole=from%1===0&&to%1===0,t0=performance.now(),dur=300; // whole dollars count in whole dollars
  const step=t=>{const p=Math.min(1,(t-t0)/dur),v=p<1?from+(to-from)*(1-Math.pow(1-p,3)):to;
    hudCash.shown=v;el.textContent=fmt(whole?Math.round(v):v);if(p<1)hudCash.raf=requestAnimationFrame(step)};
  hudCash.raf=requestAnimationFrame(step);
}

const TAG_INFO={SWEET:"Sweet drinks.",SOUR:"Tart, lemony drinks.",FANCY:"Fancy, special drinks.",CHILLED:"Drinks served icy cold.",FIZZY:"Bubbly drinks."};

}

function ingTip(id){
  if(id==="cups")return "Every customer needs 1 cup.";
  if(id==="lemons")return `Each pitcher needs ${BASE_NEEDS.lemons} lemons and makes ${pitcherServes()} ${plural(pitcherServes(),"cup")}. Lemons stay fresh for ${SHELF.lemons} ${plural(SHELF.lemons,"day")}.`;
  if(id==="sugar")return `Each pitcher needs ${BASE_NEEDS.sugar} sugar.`;
  if(id==="ice")return "Ice goes in every cup. Hot days need more. Half of your leftover ice melts each night.";
  return `Needed for ${listWords(S.recipes.filter(rk=>(RECIPES[rk].needs||{})[id]).map(rk=>`${RECIPES[rk].name} (${RECIPES[rk].needs[id]} per pitcher)`))}.`;
}
/* Your upgrade slots, shown wherever you make choices so upgrades never hide. */
function shelfHtml(){
  let slots="";
  for(let i=0;i<gearSlots();i++){const g=GEAR.find(x=>x.id===S.gear[i]);
    slots+=g?`<span class="slot" tabindex="0"${tip(`${g.name}: ${g.desc}`)}>${gearIconHtml(g.id,true)}</span>`:`<span class="slot empty" tabindex="0"${tip("Empty slot. You win upgrades after each day.")}></span>`}
  return `<div class="shelf"><b>My Stand</b><div class="slots">${slots}</div><button class="btn sm ghost" onclick="showBuild()">See all</button></div>`;
}

  const st=$(".stage");if(!st)return;
  st.classList.remove(...FIT_STEPS);

  M.card=i;if(!quiet)sfx.tick();
  const sl=$("#mSpot .slides");if(!sl)return;
  void sl.offsetWidth; // slide from where it is now
  sl.style.setProperty("--card",i);
  sl.querySelectorAll(".slide").forEach((el,k)=>el.inert=k!==i);
  document.querySelectorAll("#mSpot .carNav .dot").forEach(b=>b.setAttribute("aria-current",+b.dataset.k===i));
  document.querySelectorAll("#mSpot .carNav .arrow").forEach(b=>b.setAttribute("aria-disabled",+b.dataset.d<0?i===0:i===SPOT_SLIDES.length-1));

/* A mouse wheel scrolls a sideways strip (the supplies shelf, the price tags) sideways. */
function wheelSideways(e,el){if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){el.scrollLeft+=e.deltaY;e.preventDefault()}}

function stepSigns(d){ // + buys one sign, − gives one back for what it cost
  const p=signPrice();
  if(d<0){if(M.signs<=0)return;M.signs--;S.cash=Math.round((S.cash+p)*100)/100;sfx.tick()}
  else{if(S.cash<p){sfx.bad();return}M.signs++;S.cash=Math.round((S.cash-p)*100)/100;sfx.coin(3)}
  updateHUD();morningParts();
}

function stepPrice(rk,d){
  const v=Math.round((M.prices[rk]+0.25*d)*100)/100;
  if(v<0.5||v>priceMax())return;
  M.prices[rk]=S.menuPrices[rk]=v;sfx.tick();morningParts();

/* Today's menu: flavors you have supplies for. A flavor missing an ingredient sits out until you buy it. */
function sellableNow(){return S.recipes.filter(rk=>canBrew(rk,S.inv))}
function missingIds(rk){return Object.entries(pitcherNeeds(rk)).filter(([k,v])=>(S.inv[k]||0)<v).map(([k])=>k)}
function missingNames(rk){return listWords(missingIds(rk).map(k=>INGREDIENTS[k].name.toLowerCase()))}
/* Cups a stock of supplies can still pour: brew any flavor you can make until nothing brews. */
function brewableServings(inv){let n=0,guard=0;while(guard++<300){const rk=S.recipes.find(r=>canBrew(r,inv));if(!rk)break;Object.entries(pitcherNeeds(rk)).forEach(([k,v])=>inv[k]-=v);n+=pitcherServes()}return n}
function cupsFromSupplies(){return Math.min(brewableServings({...S.inv}),S.inv.cups||0,M.icePerCup>0?Math.floor((S.inv.ice||0)/M.icePerCup):Infinity)}

/* ---------- Day resolution ---------- */
let D=null; // day state
const MORNING_SHARE=0.55;
/* How much more can still be poured: open pitchers + what stock can still brew (cups cap it). */
function servingsReady(){
  let open=0;Object.values(D.open).forEach(v=>open+=v);
  return Math.min(S.inv.cups,open+brewableServings({...S.inv}));
}
function standDry(){return servingsReady()<=0}
function cheapestFlavor(){return D.menu.reduce((a,bk)=>menuPrice(bk)<menuPrice(a)?bk:a,D.menu[0])}
function brewPitcher(rk){
  if(!canBrew(rk,S.inv))return false;
  S.brewCount=(S.brewCount||0)+1;
  const freePitcher=S.gear.includes("pitcher")&&S.brewCount%4===0; // Grandma's Pitcher: every 4th is on her
  if(freePitcher)logLine(`<span class="good">Grandma's Pitcher: this pitcher is free.</span>`);
  else Object.entries(pitcherNeeds(rk)).forEach(([k,v])=>{S.inv[k]-=v});
  let servings=pitcherServes();
  if(S.gear.includes("brother")&&!D.brotherSpilled){D.brotherSpilled=true;servings-=2;logLine(`<span class="bad">Little Brother spilled 2 cups.</span>`)}
  D.open[rk]=servings;D.brewed[rk]=(D.brewed[rk]||0)+1;
  return true;
}
/* One customer, one cup. Returns sold | price | warm | out. */
function serveOne(ck){
  const b=D.build;
  if(S.inv.cups<=0)return "out";
  if(M.icePerCup>0&&S.inv.ice<M.icePerCup)return "out";
  if(iceAccept()<1&&Math.random()>iceAccept())return "warm";
  let rk;const isCrew=D.crewLeft>0;
  if(isCrew){rk=cheapestFlavor()}
  else{
    let sum=0;const w={};
    D.menu.forEach(r=>{const ap=appealFor(ck,r,b);w[r]=ap*ap*ap*RECIPES[r].appeal;sum+=w[r]}); // taste cubed: preference decides the order
    let roll=Math.random()*sum;rk=D.menu[0];
    for(const r of D.menu){roll-=w[r];if(roll<=0){rk=r;break}}
    // price acceptance uses the same curve as the demand estimate, so projections stay honest:
    // at or under their willingness they always buy; far above it, most walk — after one re-pick.
    const will=payWillingness(ck,b,M.actualWx);
    const tryBuy=r=>Math.random()<Math.min(1,priceFactor(will,menuPrice(r)));
    if(!tryBuy(rk)){
      const alt=D.menu.filter(r2=>r2!==rk).sort((x,y)=>appealFor(ck,y,b)-appealFor(ck,x,b))[0];
      if(alt&&tryBuy(alt))rk=alt; else return "price";
    }
  }
  if(!D.open[rk]||D.open[rk]<=0){
    if(!brewPitcher(rk)){
      const alt=D.menu.filter(r2=>r2!==rk&&((D.open[r2]||0)>0||canBrew(r2,S.inv))).sort((x,y)=>appealFor(ck,y,b)-appealFor(ck,x,b))[0];
      if(!alt)return "out";
      rk=alt;
      if((!D.open[rk]||D.open[rk]<=0)&&!brewPitcher(rk))return "out";
    }
  }
  D.open[rk]--;S.inv.cups--;S.inv.ice=Math.max(0,S.inv.ice-M.icePerCup);
  const rev=saleRevenue(1,menuPrice(rk),rk);
  D.revenue+=rev;D.revBy[rk]=(D.revBy[rk]||0)+rev;D.tips+=rev*tipRate()*Math.random();
  D.cogs+=servingCost(rk);
  D.sold++;D.soldBy[rk]=(D.soldBy[rk]||0)+1;D.lastFlavor=rk; // the day scene shows it over the buyer
  const sc=D.soldByCrowd[ck]||(D.soldByCrowd[ck]={});sc[rk]=(sc[rk]||0)+1; // the evening report shows who bought what
  if(D.crewLeft>0)D.crewLeft--;
  return "sold";
}
function openStand(){
  if(!M.loc){alert("Pick a spot first.");return}
  const b=computeBuild();
  const putOut=M.signs; // every sign bought this morning goes out, and they're paid for already: starting the day never charges you
  S.last={ice:M.icePerCup};
  S.recipes.forEach(rk=>{S.menuPrices[rk]=M.prices[rk]});
  sfx.pop();
  M.actualWx=M.trueWx;
  D={signs:putOut,build:b,
     roll:rnd(0.87,1.13),open:{},brewed:{},soldBy:{},soldByCrowd:{},sold:0,morningSold:0,unmet:0,
     awayPrice:0,awayWarm:0,awayOut:0,revenue:0,revBy:{},tips:0,paid:0,cogs:0,
     skip:false,done:false,brotherSpilled:false,crewLeft:0};
  const canSell=sellableNow();D.menu=canSell.length?canSell:S.recipes.slice(); // only flavors you have supplies for
  const minPrice=Math.min(...D.menu.map(rk=>menuPrice(rk)));
  D.crew=M.event&&M.event.id==="crewbuy"&&minPrice<=CREW_MAX_PRICE+1e-9?crewSize():0;
  D.crewLeft=D.crew;
  let full=demandEstimate(M.loc,putOut,{wx:M.actualWx,noCrew:true,menu:D.menu}).demand;
  full=Math.round(full*D.roll);
  D.morningDemand=Math.round(full*MORNING_SHARE)+D.crew;
  D.aftDemand=full-Math.round(full*MORNING_SHARE);
  D.demand=D.morningDemand+D.aftDemand;
  renderDayScene();
  runDayPhase("morning");
}

function crowdMixLine(){const mix=crowdMixFor(M.loc);return Object.entries(mix).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${CROWDS[k].icon} ${v}%`).join(", ")}
/* The newest line of the day pops up as a toast over the sky; the evening report keeps them all. */
function logLine(html){const el=$("#dayToast");if(el){el.innerHTML=html;el.style.animation="none";void el.offsetWidth;el.style.animation=""} S.log.push(html)}
function sleep(ms){ // simulation-time wait: scales with SPEED, live, and Skip ends it now
  return new Promise(res=>{
    if(D&&D.skip)return res();
    let acc=0,last=performance.now();
    const iv=setInterval(()=>{
      if(D&&D.skip){clearInterval(iv);return res()}
      const now=performance.now();acc+=(now-last)*SPEED;last=now;
      if(acc>=ms){clearInterval(iv);res()}
    },40);
  });
}
function specialBonus(rk){return S.gear.includes("special")&&M&&M.special===rk?0.5:0}
function saleRevenue(n,price,rk){
  let rev=n*price;
  if(S.gear.includes("zester")&&rk&&RECIPES[rk].tags.includes("SOUR"))rev+=n*0.50;
  if(rk)rev+=n*specialBonus(rk);
  return rev;
}
function tipRate(){
  let r=0.06*computeBuild().tipMult*(M.event&&M.event.id==="newspaper"?1.5:1);
  if(M.actualWx==="perfect")r*=1.6;
  return r;
}
/* How a half-day's line walks past: one walker per person up to 12, then walkers grow with the
   square root of the line (up to WALKERS_MAX, so the street never jams) and some buy for friends too.
   Returns each walker's party size; the sizes add up to the line. */
const WALKERS_MAX=24;
function partySizes(people){
  const n=Math.min(people,WALKERS_MAX,Math.round(Math.sqrt(12*people)));
  const sizes=Array(n).fill(1),w=sizes.map(()=>Math.random()+0.3),sum=w.reduce((a,b)=>a+b,0);
  for(let i=n;i<people;i++){let r=Math.random()*sum,k=0;while((r-=w[k])>0&&k<n-1)k++;sizes[k]++}
  return sizes;
}
async function runDayPhase(phase){
  const isMorning=phase==="morning";
  const target=isMorning?D.morningDemand:D.unmet+D.aftDemand;
  if(isMorning&&D.crew)logLine(`<span class="good">${D.crew} road workers buy your cheapest flavor.</span>`);
  const mix=crowdMixFor(M.loc);
  const mixArr=[];Object.entries(mix).forEach(([k,v])=>{for(let i=0;i<v;i++)mixArr.push(k)});
  let streak=0,processed=0,dry=false;
  const parties=partySizes(target),gap=600*Math.sqrt(12/Math.max(12,parties.length)); // more walkers come closer together, so busy days run only a little longer
  for(const size of parties){
    if(processed>=target)break;
    const ck=pick(mixArr)||"parents";const c=CROWDS[ck];
    let miss=null;const got={},takings=D.revenue+D.tips; // got: cups of each flavor this walker buys
    for(let j=0;j<size&&processed<target;j++){
      const res=serveOne(ck);
      processed++;
      if(res==="sold"){streak++;got[D.lastFlavor]=(got[D.lastFlavor]||0)+1}
      else if(res==="price"){D.awayPrice++;streak=0;miss="too pricey…"}
      else if(res==="warm"){D.awayWarm++;streak=0;miss=`too warm… ${iconHtml("supply","ice")}`}
      else { // out of stock: the rest of this phase's line can't be served
        if(isMorning){D.unmet+=target-processed}
        else D.awayOut+=target-processed;
        processed=target;dry=true;break;
      }
    }
    if(!D.skip)spawnCustomer(ck,Object.keys(got).length?{buys:true,paid:D.revenue+D.tips-takings,got,streak,say:Math.random()<0.24?c.line:null}:{say:miss});
    updateDayStats();
    if(dry)break;
    await sleep(rnd(gap*0.75,gap*1.25));
  }
  if(dry&&(isMorning?D.unmet>0:D.awayOut>0))logLine(`<span class="bad">${iconHtml("supply","cups")} You ran out of supplies.${isMorning?" People in line will wait until noon.":""}</span>`);
  if(!isMorning){await buyersServed();finishDay();return}
  D.morningSold=D.sold;
  if(standDry()){await buyersServed();finishDay();return}
  const msg=$("#dayMsg");if(msg)msg.textContent="Noon. More people are coming.";
  if(D.skip)resumeAfternoon();else after(900,resumeAfternoon);
}
function updateDayStats(){
  const st=$("#stStock");if(!st)return;
  st.textContent=servingsReady();
  const till=D.skip?D.revenue+D.tips:D.paid; // money lands when a buyer pays at the counter; Skip shows it all
  $("#stTill").textContent=fmt(till);
  showCash(S.cash+till); // the HUD counts up with each sale; the evening adds bonuses on top
  const left=Math.max(0,D.demand-D.sold-D.awayPrice-D.awayWarm-D.awayOut);
  $("#stDem").textContent=left;
  $("#dayFill").style.width=(D.demand?100*(1-left/D.demand):100)+"%";
}
/* Customers walk across the scene. Buyers stop at the counter and face you while they pay,
   then walk on with a cup; everyone else walks past, saying why as they pass the stand. */
const WALK_SPEED=75; // sprite pixels a second, so phones and desktops walk at the same pace
function spawnCustomer(ck,{buys=false,paid=0,got={},say=null,streak=0}={}){
  const sky=$("#skyBox");if(!sky)return;
  const day=D,d=document.createElement("div"),fw=ck==="parents"?32:24,fromLeft=Math.random()<0.5;
  const walkLook=carry=>{d.className=`cust ${carry?"carry":"walk"}${fromLeft?"":" left"}`;d.style.backgroundImage=`url(${CUSTOMER_WALK_PNG[ck]})`};
  d.style.setProperty("--fw",fw);walkLook(false);sky.appendChild(d);
  const W=sky.clientWidth,w=d.offsetWidth,speed=WALK_SPEED*(w/fw)/1000; // px per ms at 1×
  const from=fromLeft?-w:W+w,to=fromLeft?W+w:-w;
  const walk=(a,b)=>{ // duration is authored at 1×; playbackRate carries the live speed
    const anim=d.animate([{left:a+"px"},{left:b+"px"}],{duration:Math.abs(b-a)/speed,fill:"forwards"});
    anim.playbackRate=SPEED;liveAnims.add(anim);
    anim.finished.finally(()=>liveAnims.delete(anim));
    return anim.finished;
  };
  if(!buys){
    walk(from,to).then(()=>d.remove());
    if(say)after(Math.abs(W/2-from)/speed,()=>spawnBubble(say,d)); // talk as they pass the stand
    return;
  }
  const standW=($(".stand")||d).offsetWidth,spot=W/2+(Math.random()-0.5)*standW*0.7;
  day.buying=(day.buying||0)+1;
  walk(from,spot).then(()=>{
    if(!d.isConnected){day.buying--;return}
    d.className="cust front";d.style.backgroundImage=`url(${CUSTOMER_PNG[ck]})`;
    const coins=Math.min(3,Object.values(got).reduce((a,b)=>a+b,0)); // a coin per cup, up to 3, so bigger orders sound bigger
    const payCoin=k=>{sfx.coin(Math.max(0,streak-coins+1+k));spawnCoin(spot)};
    payCoin(0);for(let k=1;k<coins;k++)after(k*140,()=>payCoin(k));
    spawnFlavor(spot,got);
    day.paid+=paid;updateDayStats();
    if(say)after(1000,()=>spawnBubble(say,d)); // pay first, then talk, so the coin and flavor don't overlap the bubble
    after(800,()=>{day.buying--;if(!d.isConnected)return;walkLook(true);walk(spot,to).then(()=>d.remove())});
  });
}
/* Before the report, let buyers who are on their way finish buying. */
async function buyersServed(){
  let waited=0; // in simulation ms, so the grace period scales with SPEED too
  while(D&&D.buying>0&&!D.skip&&waited<5000){await sleep(100);waited+=100}
}
/* One speech bubble at a time, sitting above the customer who is talking
   and following them as they walk. If someone else is mid-sentence, the
   new line is dropped instead of stacking. Anchoring above the head also
   keeps bubbles clear of the stand sign, which hangs higher. */
let bubbleNow=null;
function spawnBubble(txt,anchor){
  const sky=$("#skyBox");if(!sky||!anchor||!anchor.isConnected)return;
  if(bubbleNow&&bubbleNow.isConnected)return; // one at a time: drop extras
  const d=document.createElement("div");d.className="bubble";d.innerHTML=txt; // the game's own lines, some with an icon
  sky.appendChild(d);bubbleNow=d;
  const place=()=>{
    if(!d.isConnected||!anchor.isConnected)return;
    const r=anchor.getBoundingClientRect(),sr=sky.getBoundingClientRect();
    const half=d.offsetWidth/2,cx=r.left+r.width/2-sr.left;
    d.style.left=Math.max(half+2,Math.min(sr.width-half-2,cx))+"px";
    d.style.bottom=(sr.bottom-r.top+4)+"px"; // just above the speaker's head
  };
  place();
  const iv=setInterval(place,40);
  after(1600,()=>{clearInterval(iv);d.remove();if(bubbleNow===d)bubbleNow=null});
}
function spawnCoin(x){
  const layer=$("#fxLayer");if(!layer)return;
  const d=document.createElement("div");d.className="coin";
  d.style.left=x+"px";layer.appendChild(d);after(800,()=>d.remove());
}
function spawnFlavor(x,got){ // what they bought, as on the chalkboard: the cup count when it's more than 1, then up to 3 flavors, most-bought first
  const layer=$("#fxLayer");if(!layer)return;
  const byCups=Object.entries(got).sort((a,b)=>b[1]-a[1]),cups=byCups.reduce((t,[,n])=>t+n,0);
  const d=document.createElement("div");d.className="flavorPop";d.setAttribute("aria-hidden","true");
  d.innerHTML=(cups>1?`<b>${cups}</b>`:"")+byCups.slice(0,3).map(([rk])=>iconHtml("flavor",rk)).join("");
  d.style.left=x+"px";d.style.animationDuration=1/SPEED+"s";layer.appendChild(d);
  d.style.marginLeft=`calc(var(--px)*-7px - ${d.offsetWidth}px)`; // right edge just left of the coin, however wide the badge
  after(1000,()=>d.remove());
}
function resumeAfternoon(){if(!D||D.done)return;const msg=$("#dayMsg");if(msg)msg.textContent="Afternoon rush…";runDayPhase("afternoon")}

/* ---------- Evening: report, draft, quotas ---------- */
function finishDay(){
  if(D.done)return;D.done=true;
  const wasted=Object.values(D.open).reduce((s,v)=>s+v,0);
  const readyLeft=servingsReady();
  const soldOut=readyLeft<=0&&D.sold>0;
  // how many of the people who came got lemonade; leftover supplies keep for tomorrow, so they never count against you
  const served=D.demand>0?D.sold/D.demand:1;
  const unserved=Math.max(0,D.demand-D.sold);
  // money is shown in cents, so the day's total is built from cent-rounded parts: the report's rows always add up exactly
  let revenue=Math.round(D.revenue*100)/100, tips=Math.round(D.tips*100)/100;
  const pourCost=D.sold>0?D.cogs/D.sold:servingCost(S.recipes[0]);
  let bannerBonus=0;
  if(S.gear.includes("selloutbanner")&&soldOut&&unserved>0){bannerBonus=Math.min(unserved,D.sold);revenue+=bannerBonus}
  const totalIn=revenue+tips;
  const made=Math.round(totalIn*100)/100; // money made today: sales and tips (supplies — signs included — were paid for when bought)
  S.cash+=totalIn;S.cash=Math.round(S.cash*100)/100;
  S.lifetimeProfit+=made;S.lifetimeSold+=D.sold;
  if(soldOut)S.sellouts++;
  // stars: the more of today's customers got lemonade, the better
  let repDelta=0,repNotes=[];
  if(D.demand>0){const step=served>=0.9?0.2:served>=0.7?0.1:served>=0.5?0:served>=0.3?-0.1:-0.2;
    repDelta+=step;repNotes.push(`${D.sold} of ${D.demand} ${plural(D.demand,"person","people")} got lemonade${step?` ${step>0?"+":"−"}${Math.abs(step)}`:""}`)}
  const avgPrice=D.sold>0?Object.entries(D.soldBy).reduce((s,[rk,n])=>s+menuPrice(rk)*n,0)/D.sold:0;
  if(S.gear.includes("chalk")&&D.signs+D.build.freeSigns>=4){repDelta+=0.2;repNotes.push("chalk art +0.2")}
  if(S.gear.includes("mascot")&&served<0.75){repDelta-=0.1;repNotes.push("mascot suit −0.1")}
  if(M.event&&M.event.id==="critic"){
    if(served>=0.9){repDelta+=0.5;repNotes.push("the critic loved it +0.5")}
    else if(served<0.5){repDelta-=0.5;repNotes.push("the critic didn't like it −0.5")}
  }
  const repBefore=S.rep;
  S.rep=clamp(Math.round((S.rep+repDelta)*10)/10,1,5);
  // perfect day: everyone served, nothing poured out
  const perfect=unserved===0&&wasted===0&&D.sold>0&&made>0;
  if(perfect)S.perfectDays++; // celebrated when its stamp lands on the receipt, below
  else if(made>20){sfx.good()} else if(made<0){sfx.bad()}
  // HOT STREAK: serve 3 of 4 customers and make money, and the day chains.
  let streakNote="";
  if(served>=0.75&&made>0){
    S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(S.streak>=2){const pct=Math.min(25,3*S.streak);const bonus=Math.round(revenue*pct/100*100)/100;S.cash+=bonus;S.lifetimeProfit+=bonus;streakNote=`Hot streak: ${S.streak} ${plural(S.streak,"day")} in a row. Bonus: <b>${fmt(bonus)}</b> (${pct}% of sales).`}
  } else if(S.gear.includes("clover")&&S.streak>=2&&S.cloverAct!==actIndex()){
    S.cloverAct=actIndex();streakNote=`Your Four-Leaf Clover saved your streak of ${S.streak} ${plural(S.streak,"day")}.`;
  } else {
    if(S.streak>=2)streakNote=`Your streak of ${S.streak} ${plural(S.streak,"day")} ended (${served<0.75?"fewer than 3 out of 4 customers got lemonade":"no money made"}).`;
    S.streak=0;
  }
  // Compound Piggy: interest on the bank, every evening
  let interestNote="";
  if(S.gear.includes("piggy")){const interest=Math.min(200,Math.floor(Math.max(0,S.cash-150)*0.04));if(interest>0){S.cash+=interest;S.lifetimeProfit+=interest;interestNote=`Piggy bank interest: +<b>${fmt(interest)}</b>.`}}
  // Rainy-Day Jar: good days save into it, the next bad day pays it out
  let jarNote="";
  if(S.gear.includes("rainjar")){
    if(["sunny","hot","perfect"].includes(M.actualWx)&&made>0){const add=Math.round(made*0.15*100)/100;S.jar=Math.round(((S.jar||0)+add)*100)/100;jarNote=`Rainy-Day Jar: +${fmt(add)} saved (${fmt(S.jar)} in the jar).`}
    else if(["cloudy","rainy"].includes(M.actualWx)&&S.jar>0){S.cash+=S.jar;S.lifetimeProfit+=S.jar;jarNote=`Rainy-Day Jar pays out <b>${fmt(S.jar)}</b>.`;S.jar=0}
  }
  S.cash=Math.round(S.cash*100)/100;
  // counterfactual — the near-miss engine
  let counter="";const outCount=Math.max(0,unserved-D.awayPrice-D.awayWarm); // left because supplies ran out
  if(unserved>0&&(D.awayOut>0||D.unmet>0))counter=`You ran out. ${outCount} more ${plural(outCount,"person","people")} wanted lemonade. That's about <b>${fmt(outCount*Math.max(avgPrice,1))}</b> you missed. Buy more supplies.`;
  else if(D.awayPrice>unserved*0.4&&D.awayPrice>0)counter=`${D.awayPrice} ${plural(D.awayPrice,"person","people")} walked away. The price was too high. Try a lower price.`;
  else if(D.awayWarm>0)counter=`${D.awayWarm} ${plural(D.awayWarm,"person","people")} wanted colder lemonade. At ${M.temp}°F, use ${iceMinToday()} ${plural(iceMinToday(),"cube")} or more.`;
  else if(wasted>0)counter=`${wasted} ${plural(wasted,"cup")} ${wasted===1?"was":"were"} poured out at closing. That's <b>${fmt(wasted*pourCost)}</b> wasted.`;
  else if(unserved>0)counter=`${unserved} ${plural(unserved,"person","people")} didn't buy. Try a lower price or another sign.`;
  else counter=`Everyone got lemonade, and nothing went to waste.`;
  const tonight=overnight(); // ice melts and old produce goes bad once you close
  const byCups=Object.entries(D.soldBy).sort((a,b2)=>b2[1]-a[1]);
  const sellRows=byCups.map(([rk,n])=>`<div class="rRow"><span><span tabindex="0"${tip(RECIPES[rk].name)}>${iconHtml("flavor",rk)}</span> ${n} ${plural(n,"cup")} at ${fmt(menuPrice(rk))}</span><span class="amt">${fmt(n*menuPrice(rk))}</span></div>`).join("");
  const upgradeBonus=Math.round((D.revenue-Object.entries(D.soldBy).reduce((s,[rk,n])=>s+n*menuPrice(rk),0))*100)/100;
  const walked=D.awayPrice,warmAway=D.awayWarm,ranOut=Math.max(0,unserved-walked-warmAway),why=[];
  if(ranOut)why.push(`${ranOut} left because you ran out`);if(walked)why.push(`${walked} said it cost too much`);if(warmAway)why.push(`${warmAway} wanted more ice`);
  const brewedTotal=Object.values(D.brewed).reduce((s,v)=>s+v,0);
  const invLine=Object.keys(INGREDIENTS).filter(id=>(S.inv[id]||0)>0).map(id=>`${S.inv[id]}${iconHtml("supply",id)}`).join(" ");
  const repExtra=repNotes.slice(D.demand>0?1:0); // the first note (people served) is the line above it
  const repLine=repNotes.length?`Stars: ${repBefore.toFixed(1)} → <b>${S.rep.toFixed(1)}</b>${repExtra.length?` (${repExtra.join(", ")})`:""}`:`Stars: <b>${S.rep.toFixed(1)}</b> (no change)`;
  const crowdRows=Object.entries(D.soldByCrowd||{}).map(([ck,byDrink])=>({ck,byDrink,total:Object.values(byDrink).reduce((t,v)=>t+v,0)})).sort((a,b)=>b.total-a.total)
    .map(({ck,byDrink})=>`<div class="csRow"><span class="csWho">${CROWDS[ck].icon} ${CROWDS[ck].name}</span><span class="csWhat">${Object.entries(byDrink).sort((a,b)=>b[1]-a[1]).map(([rk,n])=>`<span class="csDrink">${iconHtml("flavor",rk)} ${RECIPES[rk].name}: ${n} ${plural(n,"cup")}</span>`).join("")}</span></div>`).join("");
  const stamp=perfect?`<span class="rStamp">Perfect day</span>`:soldOut?`<span class="rStamp">Sold out</span>`:made<0?`<span class="rStamp bad">Rough day</span>`:"";
  const today=S.log.slice(M.logStart);
  $("#screen").innerHTML=`
  <div class="panel">
    <h2>Day ${S.day} results</h2>
    ${learnHint(HOW_STEPS[5][1])}
    <div class="report">
      <div class="receiptBox">
        <div class="receiptWrap"><div class="receipt">
          <div class="rHead">${iconHtml("spot",M.loc.name)} ${M.loc.name}</div>
          ${sellRows}
          ${upgradeBonus>0.004?`<div class="rRow"><span>Upgrade bonuses</span><span class="amt">+${fmt(upgradeBonus)}</span></div>`:""}
          ${bannerBonus?`<div class="rRow"><span>Sellout Banner pre-sales</span><span class="amt">+${fmt(bannerBonus)}</span></div>`:""}
          <div class="rRow"><span>Tips</span><span class="amt">+${fmt(tips)}</span></div>
          <div class="rTotal"><span>Money made today</span><span class="coinSpot"><span class="amt ${made>=0?"pos":"negc"}" id="madeAmt">${fmt(made)}</span></span></div>
          ${stamp}
        </div></div>
      </div>
      <div class="dayNotes">
        <p>${D.sold} of ${D.demand} ${plural(D.demand,"person","people")} got lemonade.${why.length?` ${why.join(", ")}.`:""}</p>
        <div class="note">${counter}</div>
        <p>${repLine}</p>
        ${[streakNote,interestNote,jarNote].filter(Boolean).map(n=>`<p>${n}</p>`).join("")}
        ${tonight.length?`<p>Tonight: ${listWords(tonight)}.</p>`:""}
      </div>
    </div>
    ${crowdRows?`<div class="crowdSales"><h4 class="todayHead">Who bought what</h4>${crowdRows}</div>`:""}
    <details class="numbers"><summary>See every number</summary>
      <ul class="facts">
        ${byCups.map(([rk,n])=>`<li>${iconHtml("flavor",rk)} ${RECIPES[rk].name}: <b>${n} ${plural(n,"cup")}</b></li>`).join("")}
        <li>Pitchers made: <b>${brewedTotal}</b></li>
        ${wasted?`<li>Cups poured out: <b>${wasted}</b></li>`:""}
        <li>Supplies left: <b>${invLine||"none"}</b></li>
      </ul>
      <h4 class="todayHead">Today</h4>
      <ul class="facts">${today.length?today.map(l=>`<li>${l}</li>`).join(""):"<li>A quiet day at the stand.</li>"}</ul>
    </details>
    <div class="center mt"><button class="btn gold" onclick="afterReport()">${S.day%3===0?"Open your bonus crate":"Pick an upgrade"}</button></div>
  </div>`;
  countUp($("#madeAmt"),made);
  if(perfect)celebrate("medium",$(".rStamp"),1400); // .rStamp presses down 1.2s in and takes .2s
  updateHUD();
  D.report={profit:made,perfect};
}
function afterReport(){
  if(S.cash<cheapestServingCost()&&S.cash<1){endRun("bankrupt","You don't have enough money to make a cup.");return}
