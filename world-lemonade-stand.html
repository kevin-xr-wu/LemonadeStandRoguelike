<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- The game has one fixed sunny palette. Declaring it light-only keeps
     phone browsers and webviews in dark mode from auto-darkening the page,
     which used to wash out or hide text on phones. -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffe259">
<title>World Lemonade Stand</title>
<style>
:root{
  color-scheme:light; /* fixed light palette: opt out of browser auto-darkening (see meta above) */
  --ink:#2b2118; --paper:#fff7e0; --paper2:#ffedb8; --lemon:#ffd83d; --lemon2:#f5b301;
  --green:#58b368; --green2:#2e7d46; --red:#e4572e; --blue:#4aa3df; --purple:#8b5fbf;
  --card:#fffdf4; --shadow:0 6px 0 rgba(43,33,24,.9); --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(180deg,#ffe259 0%,#ffa751 55%,#ff8c42 100%);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}
#app{max-width:1060px;margin:0 auto;padding:12px 12px 40px}
#screen{overflow-x:clip} /* pop-in animations start oversized; never let them scroll the page sideways */
/* HUD: a coin counter, a calendar page and a star meter on one dark bar. Icons are art pixels times --px. */
.hud{--px:2;display:flex;align-items:center;gap:24px;position:sticky;top:8px;z-index:50;background:var(--ink);color:#fff;border-radius:14px;padding:6px 8px 6px 12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.hudIcon{display:block;flex:none;width:calc(16px*var(--px));height:calc(16px*var(--px));background:var(--hudPng) 0 0/calc(86px*var(--px)) calc(16px*var(--px)) no-repeat;image-rendering:pixelated}
.hudCoins,.hudDay{display:flex;align-items:center;gap:8px}
.hud .money{font-size:26px;font-weight:900;line-height:1;color:var(--lemon);font-variant-numeric:tabular-nums}
.hud .money.neg{color:#ff8f6b}
.hudCoins.up .money{animation:cashUp .45s}
.hudCoins.down .money{animation:cashDown .45s}
.hudCoins.up .hudIcon,.hudCoins.down .hudIcon{animation:coinBump .3s}
@keyframes cashUp{from{color:#9be15d}}
@keyframes cashDown{from{color:#ff8f6b}}
@keyframes coinBump{40%{translate:0 calc(-2px*var(--px))}}
.calPage{background-position-x:calc(-16px*var(--px));display:flex;align-items:center;justify-content:center;padding-top:calc(5px*var(--px));color:var(--ink);font-size:calc(9px*var(--px) + 1px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.dayOf{font-weight:800;font-size:16px;color:var(--paper2)}
.starMeter{display:flex;gap:var(--px)}
.star{position:relative;width:calc(11px*var(--px));height:calc(11px*var(--px));background:var(--hudPng) calc(-75px*var(--px)) 0/calc(86px*var(--px)) calc(16px*var(--px)) no-repeat;image-rendering:pixelated}
.star:after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--f)*var(--px)*1px);background:inherit;background-position-x:calc(-64px*var(--px))} /* --f: art pixels of the star filled in */
.hudBtn{flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:10px;padding:4px;color:inherit}
.hudBtn:hover{background:rgba(255,247,224,.12)}
.hudBtn:focus-visible{outline:3px solid var(--blue)}
#btnSound{margin-left:auto}
#btnSound .hudIcon{background-position-x:calc(-32px*var(--px))}
#btnSound.off .hudIcon{background-position-x:calc(-48px*var(--px))}
.helpBtn{width:34px;height:34px;padding:0;border-radius:50%;background:var(--lemon);color:var(--ink);font-size:21px;font-weight:900;box-shadow:inset 0 -3px 0 var(--lemon2)}
.helpBtn:hover{background:#ffe470}
@media (prefers-reduced-motion:reduce){.hudCoins .money,.hudCoins .hudIcon{animation:none!important}}
.quotaWrap{flex:1;min-width:180px}
.qbar{height:14px;background:#e8dcc0;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:3px}
.qfill{height:100%;background:linear-gradient(90deg,var(--green),#9be15d);width:0%;transition:width .6s cubic-bezier(.2,1.4,.4,1)}
.qfill.danger{background:linear-gradient(90deg,var(--red),#ff9a3d)}
.iconBtn{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:6px 12px;font-weight:800;box-shadow:0 3px 0 rgba(43,33,24,.8)}
.iconBtn:active{transform:translateY(2px);box-shadow:none}
/* Panels */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px;position:relative}
h1.logo{font-size:52px;margin:6px 0 0;text-align:center;letter-spacing:.02em;color:#fff;text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink);font-weight:900}
h2{margin:0 0 8px;font-size:24px}
h3{margin:14px 0 6px}
.center{text-align:center}
.muted{opacity:.72}
.small{font-size:13px}
.big{font-size:19px;font-weight:800}
/* Cards / choices */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:10px}
.choice{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:13px;text-align:left;box-shadow:0 4px 0 rgba(43,33,24,.85);transition:transform .12s, box-shadow .12s;position:relative;width:100%}
.choice:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 7px 0 rgba(43,33,24,.85)}
.choice.sel{outline:4px solid var(--green);background:#f2ffe9}
.choice .ttl{font-size:18px;font-weight:900;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.choice .desc{font-size:13.5px;margin-top:5px;line-height:1.38}
.rar{font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:99px;border:2px solid var(--ink);white-space:nowrap;flex-shrink:0;align-self:flex-start}
.rar.common{background:#e9e2cf}.rar.rare{background:#bfe3ff}.rar.epic{background:#e3c8ff}.rar.legendary{background:var(--lemon)}
.tag{display:inline-block;background:var(--paper2);border:2px solid var(--ink);border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px;margin:2px 2px 0 0}
.kidEmoji{font-size:34px}
.warn{color:var(--red);font-weight:800}
/* Buttons */
.btn{display:inline-block;background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:13px 26px;font-size:19px;font-weight:900;box-shadow:0 5px 0 rgba(43,33,24,.9);transition:transform .1s,box-shadow .1s;text-shadow:1px 1px 0 rgba(0,0,0,.25)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 rgba(43,33,24,.9)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,24,.9)}
.btn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(180deg,var(--lemon),var(--lemon2));color:var(--ink);text-shadow:none}
.btn.blue{background:var(--blue)} .btn.red{background:var(--red)} .btn.purple{background:var(--purple)} .btn.ghost{background:#fff;color:var(--ink);text-shadow:none}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
/* Scene */
.scene{border:3px solid var(--ink);border-radius:var(--radius);overflow:hidden;margin-top:14px;box-shadow:var(--shadow);position:relative}
.sky{--px:2;height:230px;position:relative;transition:background 1s;overflow:hidden} /* --px: screen pixels per art pixel */
.sky.sunny,.sky.perfect,.sky.windy{background:#7fc4e8}
.sky.hot{background:#fff3a0}
.sky.cloudy{background:#93a9bd}
.sky.rainy{background:#5f7d99}
.ground{height:64px;background:#8a6b46 var(--groundPng) 0 0/128px 64px;position:relative;z-index:3;image-rendering:pixelated}
.ground:before{content:"";position:absolute;top:-18px;left:0;right:0;height:28px;background:var(--grassPng) 0 0/128px 28px repeat-x;image-rendering:pixelated}
/* Street and weather art, drawn in Pixelwright. Sizes are art pixels times --px. The grass edge covers the street's bottom rows. */
.wx{position:absolute;display:block;image-rendering:pixelated;pointer-events:none;background:no-repeat 0 0/100% 100%}
.street{left:0;right:0;bottom:0;height:calc(56px*var(--px));background:var(--streetPng) 50% 100%/calc(256px*var(--px)) 100% repeat-x;z-index:2}
.sun{top:calc(4px*var(--px));right:calc(6px*var(--px));width:calc(29px*var(--px));height:calc(29px*var(--px));background-image:var(--sunPng);z-index:1}
.sun.hot{top:calc(2px*var(--px));right:calc(4px*var(--px));width:calc(33px*var(--px));height:calc(33px*var(--px));background-image:var(--hotSunPng)}
.rainbow{left:calc(4px*var(--px));bottom:calc(14px*var(--px));width:calc(120px*var(--px));height:calc(60px*var(--px));background-image:var(--rainbowPng);z-index:1}
.cloud{top:calc(var(--y)*var(--px)*1px);width:calc(40px*var(--px));height:calc(16px*var(--px));background-image:var(--cloudPng);z-index:1;animation:drift linear infinite}
.cloud.dark{background-image:var(--rainCloudPng)}
.wx.flip{transform:scaleX(-1)}
.rain{inset:0;background:var(--rainPng) 0 0/calc(32px*var(--px)) calc(32px*var(--px));z-index:4;animation:rainFall .4s steps(8) infinite}
.gust{bottom:calc(var(--b)*var(--px)*1px);width:calc(48px*var(--px));height:calc(12px*var(--px));background-image:var(--gustPng);z-index:4;animation:blowBy 2.8s linear infinite}
.leaf{bottom:calc(var(--b)*var(--px)*1px);width:calc(9px*var(--px));height:calc(7px*var(--px));background-image:var(--leafPng);z-index:4;animation:blowBy 3.6s linear infinite,leafSpin .6s steps(4) infinite,leafBob 1.1s ease-in-out infinite alternate}
.shimmer{bottom:calc(var(--b)*var(--px)*1px);width:calc(11px*var(--px));height:calc(20px*var(--px));background-image:var(--shimmerPng);z-index:4;opacity:.8;animation:shimmer 2.5s ease-out infinite}
@keyframes drift{from{left:-20%}to{left:110%}}
@keyframes rainFall{to{background-position:0 calc(32px*var(--px))}}
@keyframes blowBy{0%{left:-12%;opacity:0}10%,85%{opacity:1}100%{left:105%;opacity:0}}
@keyframes leafSpin{to{rotate:360deg}}
@keyframes leafBob{to{translate:0 calc(-10px*var(--px))}}
@keyframes shimmer{0%{translate:0 0;opacity:0}30%{opacity:.8}100%{translate:0 calc(-28px*var(--px));opacity:0}}
@media (prefers-reduced-motion:reduce){.cloud,.rain,.gust,.leaf,.shimmer,.bubble,.coin,.cust.walk,.cust.carry{animation:none}}
.stand{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:128px;image-rendering:pixelated;z-index:5;filter:drop-shadow(0 4px 3px rgba(0,0,0,.3))}
.standSign{position:absolute;left:50%;bottom:134px;transform:translateX(-50%) rotate(-2deg);background:#fff;border:3px solid var(--ink);border-radius:9px;padding:2px 12px;font-weight:900;font-size:14px;z-index:6;white-space:nowrap}
.crowdMix{position:absolute;top:10px;left:12px;background:rgba(255,253,244,.92);border:2.5px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700;z-index:6;max-width:46%;line-height:1.5}
/* Customers: --fw is the frame width in sprite pixels, --s the scale. left is the centre of the feet. */
.cust{--s:2;position:absolute;bottom:2px;width:calc(var(--fw)*var(--s)*1px);height:calc(var(--s)*32px);margin-left:calc(var(--fw)*var(--s)*-.5px);background:no-repeat 0 0/calc(var(--fw)*var(--s)*8px) 100%;image-rendering:pixelated;z-index:6;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.cust.left{transform:scaleX(-1)} /* the walk sheets face right */
.cust.walk{animation:custWalk .44s steps(4) infinite}
.cust.carry{animation:custCarry .44s steps(4) infinite}
.cust.front{background-size:100% 100%}
@keyframes custWalk{from{background-position-x:0}to{background-position-x:calc(var(--fw)*var(--s)*-4px)}}
@keyframes custCarry{from{background-position-x:calc(var(--fw)*var(--s)*-4px)}to{background-position-x:calc(var(--fw)*var(--s)*-8px)}}
.bubble{--rise:6px;position:absolute;font-size:12px;font-weight:800;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 8px;z-index:8;animation:floatUp 1.6s ease-out forwards;white-space:nowrap;pointer-events:none}
/* The coin pops up over the head of the customer who paid, spinning. left is its centre. */
/* Pixel-art item icons, drawn in Pixelwright: 16×16 art shown at 16px in text, or 32px with .big. --i is the icon's place on its sheet. */
.icon{--sz:16px;display:inline-block;width:var(--sz);height:var(--sz);vertical-align:-3px;background:no-repeat calc(var(--i)*var(--sz)*-1) 0/calc(var(--n)*var(--sz)) var(--sz);image-rendering:pixelated}
.icon.big{--sz:32px;vertical-align:-9px}
.icon.supply{--n:16;background-image:var(--supplyIcons)}
.icon.flavor{--n:12;background-image:var(--flavorIcons)}
.icon.spot{--n:13;background-image:var(--spotIcons)}
.icon.gearA{--n:20;background-image:var(--gearIconsA)}
.icon.gearB{--n:19;background-image:var(--gearIconsB)}
.coin{--s:2;--rise:28px;position:absolute;bottom:64px;width:calc(var(--s)*10px);height:calc(var(--s)*10px);margin-left:calc(var(--s)*-5px);background:var(--coinPng) 0 0/calc(var(--s)*40px) 100% no-repeat;image-rendering:pixelated;z-index:9;animation:coinFly .8s ease-out forwards,coinSpin .32s steps(4) infinite;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,calc(var(--rise)*-1))}}
@keyframes coinFly{0%{transform:translateY(0)}60%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--rise)*-1))}}
@keyframes coinSpin{to{background-position-x:calc(var(--s)*-40px)}}
/* Day controls live in the scene: Skip and Speed as small corner buttons. */
.sceneBtns{position:absolute;top:10px;right:12px;z-index:7;display:flex;gap:6px}
.sceneBtns .btn{box-shadow:0 2px 0 rgba(43,33,24,.85)}
.dayStats{display:flex;flex-wrap:wrap;gap:8px;background:#2b2118;color:#fff;padding:10px 14px;font-weight:800;font-size:15px}
.dayStats .phaseTxt{color:var(--lemon);margin-right:auto}
.dayStats span b{color:var(--lemon)}
/* Evening report: the day's math is a till receipt, the tip a sticky note */
.pos{color:var(--green2)} .negc{color:var(--red)}
.report{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px 28px;align-items:start}
.receiptBox{max-width:340px;width:100%;justify-self:center}
.receiptWrap{transform:rotate(-.8deg);filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(0 4px 0 rgba(43,33,24,.35))}
.receipt{background:#fff;padding:20px 18px 24px;font-size:16px;
  -webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/16px 8px repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 16px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x;
          mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/16px 8px repeat-x,linear-gradient(#000 0 0) center/100% calc(100% - 16px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 8px repeat-x}
.rHead{text-align:center;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:8px}
.rRow,.rTotal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0}
.amt{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.rTotal{border-top:2px dashed #cdbf9d;margin-top:8px;padding-top:10px;font-weight:900}
.rTotal .amt{font-size:30px;line-height:1}
.coinSpot{position:relative;display:inline-block}
.dropCoin{position:absolute;bottom:30%;font-size:20px;margin-left:-10px;pointer-events:none;animation:coinDrop .5s ease-in both}
@keyframes coinDrop{0%{transform:translateY(-60px) rotate(-30deg);opacity:0}25%,80%{opacity:1}100%{transform:translateY(0) rotate(20deg) scale(.6);opacity:0}}
.rStamp{display:block;width:max-content;margin:12px auto 0;border:3px solid currentColor;border-radius:8px;padding:1px 10px;font-size:15px;font-weight:900;letter-spacing:.08em;color:var(--green2);transform:rotate(-4deg);opacity:.85;animation:stampPress .2s ease-out 1.2s both}
.rStamp.bad{color:var(--red)}
@keyframes stampPress{from{transform:scale(1.7) rotate(-4deg);opacity:0}to{transform:rotate(-4deg);opacity:.85}}
.dayNotes p{margin:0 0 10px;line-height:1.45}
.note{position:relative;max-width:420px;background:#fff3a0;padding:12px 14px 10px;margin:14px 0 12px;line-height:1.4;transform:rotate(.6deg);box-shadow:0 5px 6px -3px rgba(43,33,24,.35)}
.note:before{content:"";position:absolute;top:-7px;left:50%;width:54px;height:14px;margin-left:-27px;background:rgba(201,167,122,.5);transform:rotate(-3deg)} /* tape */
.facts{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px;line-height:1.4}
.todayHead{margin:10px 0 0;font-size:15px}
/* End screen: the score first, then a few highlights */
.scoreLabel{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:4px}
.scoreBig{font-size:64px;font-weight:900;line-height:1.1;color:var(--lemon);text-shadow:3px 3px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink);font-variant-numeric:tabular-nums}
.highlights{list-style:none;margin:16px auto;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;max-width:560px}
.highlights li{display:flex;flex-direction:column;align-items:center;line-height:1.25}
.highlights .hlIcon{font-size:30px}
.highlights b{font-size:22px}
.highlights small{font-size:13px;opacity:.75}
@media (prefers-reduced-motion:reduce){.dropCoin{display:none}.rStamp{animation:none}}
@keyframes stampIn{from{transform:scale(2.4) rotate(8deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
/* Inventory chips */
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.inv .item{background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:800}
.synBanner{background:linear-gradient(90deg,var(--purple),#c86bfa);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:900;font-size:17px;margin-top:10px;box-shadow:0 4px 0 rgba(43,33,24,.85);animation:stampIn .4s cubic-bezier(.2,2,.4,1)}
.log{background:#fffdf4;color:var(--ink);border:2.5px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.6;max-height:170px;overflow-y:auto;margin-top:10px;box-shadow:var(--shadow)}
.log .good{color:var(--green2)}.log .bad{color:var(--red)}.log .info{color:#1c5fa8}
/* Confetti + modal */
.confetti{position:fixed;width:11px;height:15px;z-index:999;pointer-events:none;border-radius:2px}
.modalWrap{position:fixed;inset:0;background:rgba(30,20,8,.62);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px}
.modal{background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;animation:stampIn .3s cubic-bezier(.2,1.8,.4,1)}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.mt{margin-top:14px}.mb{margin-bottom:8px}
.hidden{display:none!important}
.nowrap{white-space:nowrap}
@media(max-width:640px){h1.logo{font-size:38px}.sky{height:200px}.crowdMix{max-width:58%}}

/* ==================== Kid-friendly layer: tips, upgrade shelf, guess bar, the math ==================== */
#tipBox{position:fixed;left:0;top:0;z-index:400;max-width:min(260px,calc(100vw - 16px));background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;line-height:1.35;padding:8px 11px;border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .1s}
#tipBox.on{opacity:1}
[data-tip]:not(button){cursor:help}
[data-tip]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.goal{text-align:center;font-weight:900;font-size:21px;margin:8px 0 12px}
.playBtn{font-size:30px;padding:16px 64px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.step{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;box-shadow:0 4px 0 rgba(43,33,24,.85)}
.stepIcon{font-size:30px;line-height:1.1}
.step span:last-child{font-size:14px;opacity:.8}
details.more,details.numbers{margin-top:12px;border-top:2px dotted #cdbf9d;padding-top:6px}
details summary{cursor:pointer;font-weight:900;padding:6px 0}
.rules,.list{margin:6px 0 0;padding-left:20px;display:grid;gap:6px;line-height:1.45}
.shelf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;margin:10px 0 4px}
.slots{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.slot{width:46px;height:46px;border:3px solid var(--ink);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 0 rgba(43,33,24,.8)}
.slot.empty{border-style:dashed;background:transparent;box-shadow:none;opacity:.5}
.crowdRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.crowd{background:var(--paper2);border:2px solid var(--ink);border-radius:99px;padding:1px 8px;font-size:13px;font-weight:800}
.face{font-size:22px;vertical-align:-3px}
.forecastBar{flex-direction:column;align-items:flex-start;gap:2px;padding:12px 16px}
.forecastBar .fcLabel{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.forecastBar .fcMain{font-size:24px;font-weight:900}
.forecastBar .fcDesc{font-size:17px}
.guessBar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:40;margin-top:16px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#guessText{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;flex:1 1 260px;font-weight:800;font-size:15px}
#guessText .nums{display:flex;flex-wrap:wrap;gap:4px 16px}
.guessBar i,.hud i{font-style:normal}
#guessText b{color:var(--lemon);font-size:18px}
#guessText .pos{color:#9be15d} #guessText .negc{color:#ff8f6b}
.guessBar #btnOpen{font-size:20px;padding:12px 22px;margin-left:auto}
.typeLabel{font-weight:900;opacity:.55}
/* Morning: set up the stand. Spots are signposts, supplies sit on a shelf, signs stand on the grass, prices go on a chalkboard. */
.mLbl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;margin:12px 0 6px;font-weight:900;font-size:16px}
.mLbl small{font-size:13px;font-weight:700;opacity:.8}
.mHint{margin-top:6px;font-size:13px;font-weight:700;line-height:1.35;opacity:.8}
.posts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;max-width:760px}
.post{display:grid;background:none;border:0;padding:0;color:var(--ink);filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink)) drop-shadow(0 3px 0 rgba(43,33,24,.85))}
.postFace{display:grid;justify-items:center;align-content:start;gap:3px;padding:7px 18px 7px 8px;background:#d39a5c;font-size:13px;font-weight:900;line-height:1.15;text-align:center;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.post:hover .postFace{background:#e0ab70}
.post[aria-pressed="true"] .postFace{background:var(--lemon)}
.post:active{transform:translateY(2px)}
.post:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.supShelf{margin-top:14px;background:#d39a5c;border:3px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px 2px;overflow:hidden}
.supShelf .mLbl{margin-top:0}
.shelfRow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px -14px 10px;padding:0 14px 6px;border-bottom:6px solid #7a4428}
.item{position:relative;display:grid;justify-items:center;align-content:start;gap:2px;background:none;border:0;border-radius:10px;padding:5px 2px 3px;color:var(--ink)}
.item:hover{background:rgba(255,247,224,.4)}
.item[aria-expanded="true"]{background:var(--paper)}
.item:focus-visible{outline:3px solid var(--blue)}
.item .n{position:absolute;top:1px;right:4px;min-width:20px;background:var(--ink);color:#fff;border-radius:99px;padding:0 5px;font-size:11.5px;font-weight:900;font-variant-numeric:tabular-nums}
.item .n.zero{background:var(--red)}
.item .nm{font-size:11.5px;font-weight:800;line-height:1.1;text-align:center}
.drawer{display:grid;gap:6px;max-width:460px;margin:-4px 0 12px;background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:8px 10px 10px}
.drawer .mLbl{margin:0}
.rule{font-size:13px;font-weight:700;opacity:.8}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.packs .btn{position:relative;padding:5px 4px 6px;border-radius:11px;font-size:17px;line-height:1.15;box-shadow:0 3px 0 rgba(43,33,24,.9)}
.packs .btn small{display:block;font-size:12.5px}
.packs .off{position:absolute;top:-9px;right:-5px;background:var(--lemon);color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:0 5px;font-size:11px;font-style:normal;text-shadow:none;transform:rotate(6deg)} /* the bulk discount, as a sale sticker */
.packs .btn[aria-disabled="true"]{filter:grayscale(.7);opacity:.55;cursor:not-allowed;transform:none}
.gear{display:grid;gap:0 28px}
.gear .mLbl{margin-top:0}
.gear>div+div{margin-top:14px}
.cubes{display:flex;flex-wrap:wrap;gap:6px}
.cube{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:3px;line-height:0;box-shadow:0 3px 0 rgba(43,33,24,.85)}
.cube[aria-pressed="true"]{background:#e3f5ff}
.cube[aria-pressed="false"] .icon{filter:grayscale(1);opacity:.3}
.cube:active,.stepper button:active{transform:translateY(2px);box-shadow:none}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;padding:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;font-size:20px;font-weight:900;line-height:1;box-shadow:0 2px 0 rgba(43,33,24,.85)}
.stepper button[aria-disabled="true"]{opacity:.4;cursor:not-allowed}
.stepper b{min-width:54px;padding:0 2px;white-space:nowrap;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.board{margin-top:14px;background:#2f3b33;color:#f4f1e6;border:3px solid var(--ink);border-radius:var(--radius);box-shadow:inset 0 0 0 7px #a86a3a,var(--shadow);padding:16px 18px 14px}
.board .mLbl{margin-top:0;color:var(--lemon)}
.prices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px 32px}
.price{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px}
.price.out>.icon,.price.out .pName{opacity:.55}
.pName{font-weight:900;font-size:15px}
.pOut{grid-column:1/-1;font-size:13px;font-weight:700;color:#ffc9b8}
.board .stepper b{color:var(--lemon)}
.board .tag{color:var(--ink)}
/* Signs you own stand on the grass by the stand; tap one to put it out or take it in. --k is its place out from the stand, --side left or right. */
.signSlot{--w:calc(16px*var(--px) + 16px);position:absolute;bottom:0;z-index:5;width:var(--w);height:var(--w);margin-left:calc(var(--w)/-2);left:calc(50% + var(--side)*(32px*var(--px) + var(--w)/2 + 2px + var(--k)*(var(--w) + 2px)));display:flex;align-items:flex-end;justify-content:center;background:none;border:2px dashed transparent;border-radius:8px;padding:0}
.signSlot .icon{--sz:calc(16px*var(--px));filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.signSlot.off{border-color:var(--paper);background:rgba(43,33,24,.2)}
.signSlot.off .icon{opacity:.45;filter:grayscale(1)}
.signSlot:focus-visible{outline:3px solid var(--blue)}
@media (min-width:721px){
  .postFace{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
  .shelfRow{grid-template-columns:repeat(auto-fill,84px)}
  .gear{grid-template-columns:1fr 1fr}
  .gear>div+div{margin-top:0}
}
@media (max-width:720px){ /* bottom bar: forecast and a short Open button, one row when they fit */
  .guessBar{padding:8px 10px;gap:8px}
  #guessText{flex:1 1 auto;font-size:14px;gap:6px 10px}
  #guessText .nums{gap:4px 12px}
  #guessText b{font-size:16px}
  .guessBar i.long{display:none}
  .guessBar #btnOpen{flex:0 0 auto;margin-left:auto;font-size:18px!important;padding:10px 16px!important}
}
@media (max-width:560px){ /* phones: one-row top bar (sound moves into the ? help), stacked shelf */
  .playBtn{font-size:24px;padding:14px 40px}
  .hud .dayOf,#btnSound{display:none} /* the calendar page shows the day; its tip says "of 14" */
  .hud{gap:12px}
  .helpBtn{margin-left:auto}
  .shelf .slots{order:3;flex:1 1 100%}
  .shelf .btn{margin-left:auto}
  .slot{width:40px;height:40px;font-size:22px}
  .highlights{grid-template-columns:repeat(2,1fr)}
  .scoreBig{font-size:52px}
  .forecastBar .fcMain{font-size:20px}
  .forecastBar .fcDesc{font-size:15px}
}

/* ==================== Mobile / responsive layer ====================
   Desktop rules above are untouched; everything here only kicks in on narrow
   or touch screens, plus a few platform fixes (dvh, safe-area, tap zoom). */
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select{touch-action:manipulation}
.log{overflow-x:hidden;overflow-wrap:break-word}
@media (hover:none){
  .choice:hover{transform:none;box-shadow:0 4px 0 rgba(43,33,24,.85)}
  .btn:hover{transform:none;box-shadow:0 5px 0 rgba(43,33,24,.9)}
}
@media (max-width:720px){
  #app{padding:8px 8px 34px}
  h1.logo{font-size:clamp(26px,8.5vw,52px)}
  h2{font-size:21px}
  .big{font-size:17px}
  .panel{padding:13px;margin-top:10px}
  /* HUD: icons stay at 2× so they read on a phone; the bar gets tighter instead */
  .hud{gap:16px;top:4px;padding:4px 6px 4px 10px;border-radius:12px}
  .hud .money{font-size:20px}
  .hudCoins,.hudDay{gap:5px}
  .dayOf{font-size:14px}
  .helpBtn{width:30px;height:30px;font-size:18px}
  .quotaWrap{min-width:150px}
  .qbar{height:12px}
  .iconBtn{padding:6px 9px;border-radius:10px}
  /* Scene scales down, nothing overlaps the stand sign */
  .sky{height:188px;--px:1}
  .ground{height:54px;background-size:64px 32px}
  .ground:before{top:-9px;height:14px;background-size:64px 14px}
  .stand{width:64px;bottom:0}
  .standSign{bottom:68px;font-size:12px;padding:2px 8px;max-width:92%}
  .crowdMix{font-size:11.5px;max-width:54%;padding:4px 8px;line-height:1.4}
  .sceneBtns{flex-direction:column;align-items:flex-end;gap:5px}
  .cust{--s:1;bottom:1px}
  .bubble{font-size:11px;--rise:4px}
  .coin{--s:1;--rise:14px;bottom:32px}
  .dayStats{font-size:13.5px;padding:8px 10px;gap:6px}
  .mLbl{font-size:15px}
  .supShelf{margin-top:10px;padding:8px 10px 0}
  .shelfRow{margin-inline:-10px;padding-inline:10px}
  .board{margin-top:10px;padding:14px 14px 12px}
  /* Tap targets */
  .btn.sm{min-height:40px;padding:8px 12px}
  #btnOpen{font-size:19px!important;padding:14px 16px!important;max-width:100%}
  .choice{padding:11px}
  .choice .ttl{font-size:17px}
  .kidEmoji{font-size:28px}
  .synBanner{font-size:15px;padding:9px 11px}
  .report{grid-template-columns:1fr;gap:14px}
  .receipt{padding:16px 16px 20px;font-size:15px}
  .rRow{padding:2px 0}
  .rTotal .amt{font-size:27px}
  .dayNotes p{margin-bottom:8px}
  .log{font-size:12.5px;max-height:150px}
  .modalWrap{padding:8px}
  .modal{padding:15px;max-height:92dvh}
}
@media (max-width:560px){
  .choices{grid-template-columns:1fr} /* draft picks and swaps: one clean column */
}
@media (max-width:380px){
  .hud{gap:8px}
  .hud .money{font-size:17px}
  .btn{padding:12px 18px;font-size:17px}
  .panel{padding:11px}
}
@media (max-height:500px) and (orientation:landscape){
  .hud{top:4px}
  .sky{height:148px;--px:1}
  .ground{background-size:64px 32px}
  .ground:before{top:-9px;height:14px;background-size:64px 14px}
  .stand{width:64px;bottom:0}
  .standSign{bottom:68px}
  .cust{--s:1;bottom:1px}
  .bubble{--rise:4px}
  .coin{--s:1;--rise:14px;bottom:32px}
}

<div id="app">
  <div class="hud" id="hud" style="display:none">

/* ---------- audio (tiny WebAudio juice) ---------- */
let AC=null, soundOn=true;
function beep(freq,dur=0.07,type="square",vol=0.05,when=0){
  if(!soundOn)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+when, o=AC.createOscillator(), g=AC.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}

/* ---------- confetti ---------- */
function confetti(n=50){
  const colors=["#ffd83d","#58b368","#e4572e","#4aa3df","#c86bfa","#ff8fab"];
  for(let i=0;i<n;i++){
    const d=document.createElement("div");d.className="confetti";d.style.background=pick(colors);
    d.style.left=(45+Math.random()*10)+"vw";d.style.top="38vh";document.body.appendChild(d);
    const dx=rnd(-46,46),dy=rnd(-30,55),rot=rnd(-540,540),t0=performance.now();
    (function anim(t){const p=(t-t0)/1400;if(p>=1){d.remove();return}
      d.style.transform=`translate(${dx*p*9}px,${dy*p*9+p*p*220}px) rotate(${rot*p}deg)`;d.style.opacity=1-p;requestAnimationFrame(anim)})(t0);
  }
}

/* ---------- money count-up: a total counts up from $0 as coins drop in; reduced motion shows it at once ---------- */
function countUp(el,to){
  if(!el)return;
  if(to<=0||matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=1100;el.textContent=fmt(0);
  const step=t=>{if(!el.isConnected)return;const p=Math.min(1,(t-t0)/dur);
    el.textContent=fmt(p<1?Math.floor(to*(1-Math.pow(1-p,3))*100)/100:to);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  [-22,12,-6,20,2].forEach((x,i)=>{ // fixed spots: Math.random stays the game's alone
    const c=document.createElement("span");c.className="dropCoin";c.textContent="🪙";c.style.left=`calc(50% + ${x}px)`;c.style.animationDelay=i*0.2+"s";
    el.parentNode.appendChild(c);setTimeout(()=>{c.remove();if(el.isConnected)sfx.coin(i*4)},i*200+500);
  });
}

function skyArt(wx){
  const at=(cls,x,secs,from,range,v)=>`<i class="wx ${cls}" style="left:${x}%;${v};animation-duration:${secs}s;animation-delay:${(-secs*(x-from)/range).toFixed(2)}s"></i>`;
  const cloud=(x,y,secs,cls="cloud")=>at(cls,x,secs,-20,130,`--y:${y}`);
  const blow=(cls,x,b,secs)=>at(cls,x,secs,-12,117,`--b:${b}`);
  const art={
    sunny:`<i class="wx sun"></i>`,
    hot:`<i class="wx sun hot"></i>`+[[6,14],[22,24],[37,10],[61,20],[76,12],[90,26]].map(([x,b],i)=>`<i class="wx shimmer" style="left:${x}%;--b:${b};animation-delay:${-i*.45}s"></i>`).join(""),
    perfect:`<i class="wx rainbow"></i><i class="wx sun"></i>`,
    cloudy:cloud(2,5,90)+cloud(22,17,110,"cloud flip")+cloud(44,2,80)+cloud(66,13,100,"cloud flip")+cloud(86,4,95),
    rainy:cloud(2,3,120,"cloud dark")+cloud(28,10,140,"cloud dark flip")+cloud(55,1,130,"cloud dark")+cloud(80,8,125,"cloud dark flip")+`<i class="wx rain"></i>`,

      +blow("leaf",22,30,3.6)+blow("leaf",50,46,3.2)+blow("leaf",66,18,4)+blow("leaf",95,40,3.4),
  };
  return (art[wx]||"")+`<i class="wx street"></i>`;

  const evRoll=sampleWeighted(EVENTS.map(e=>({k:e.id,w:e.w*(gv?(GOOD_EVENTS.includes(e.id)?2:BAD_EVENTS.includes(e.id)?0.5:1):1)}))).k;
  const ev=EVENTS.find(e=>e.id===evRoll);
  const prices={};S.recipes.forEach(rk=>{prices[rk]=S.menuPrices[rk]!=null?S.menuPrices[rk]:RECIPES[rk].price});
  const temp=ri(...WX_TEMP[trueWx]);
  M={trueWx,shownWx,temp,locs,loc:null,event:ev,signs:(S.last?S.last.signs:3),icePerCup:(S.last?S.last.ice:2),prices,logStart:S.log.length,
     special:S.gear.includes("special")?pick(S.recipes):null,
     dice:S.gear.includes("dice")?Math.round(rnd(0.7,1.6)*100)/100:0};
  if(S.gear.includes("lemontree")){S.treeDays=(S.treeDays||0)+1;M.treeLemons=5+S.treeDays;addStock("lemons",M.treeLemons,0)}
  S.todayCostMult=S.tomorrowCostMult||1;S.tomorrowCostMult=1;
  if(ev.fn)ev.fn(S);
}
function crowdMixFor(loc){
  // base mix + location bias -> exact %
  const base={kids:18,parents:18,athletes:15,tourists:10,foodies:8,artists:11};
  const act=actIndex();
  if(act>=2)base.tourists+=7; if(act>=3){base.tourists+=9;base.foodies+=3;base.kids-=3}
  Object.entries(loc.bias).forEach(([k,v])=>{base[k]=(base[k]||0)+v*3});
  if(loc.name==="Boardwalk")base.tourists+=8;
  let tot=Object.values(base).reduce((a,b)=>a+b,0);
  const magnets={sponsor:"athletes",tourbus:"tourists",foodblog:"foodies"}; // ~+10 points of that crowd each
  Object.entries(magnets).forEach(([g,ck])=>{if(S.gear.includes(g))base[ck]+=tot*0.13});
  tot=Object.values(base).reduce((a,b)=>a+b,0);
  const mix={};Object.entries(base).forEach(([k,v])=>mix[k]=Math.round(v/tot*100));
  return mix;
}
function demandEstimate(loc,signs,opts={}){
  const b=computeBuild(),menu=opts.menu||S.recipes;
  const useWx=opts.wx||M.shownWx;
  let wxMult=WEATHERS[useWx].mult;
  if(S.gear.includes("sunhat")&&useWx==="sunny")wxMult=WEATHERS.hot.mult;
  if(S.gear.includes("icecrush")&&(useWx==="hot"||useWx==="perfect"))wxMult*=1.25;
  if(b.activeSynergies.includes("coldsnap")&&(useWx==="hot"||useWx==="perfect"))wxMult*=1.45;
  if(S.gear.includes("ponchos")&&useWx==="rainy")wxMult*=1.6;
  if(S.gear.includes("awning")&&(useWx==="cloudy"||useWx==="rainy"))wxMult*=1.25;
  const mix=crowdMixFor(loc);
  let trafficBase=loc.traffic;
  const repMult=(0.7+(S.rep-1)*0.2)*(S.gear.includes("loyalty")? (0.7+(S.rep-1)*0.4)/ (0.7+(S.rep-1)*0.2):1);
  const effSigns=signs+b.freeSigns;
  let signBonus;
  if(S.gear.includes("bigsign"))signBonus=1+0.10*effSigns*b.signMult;
  else signBonus=1+0.16*Math.sqrt(Math.max(effSigns,0))*b.signMult;
  // per crowd: their best flavor drives whether they come; ALL flavors share the split by preference
  let weighted=0,baseShare=0;const split={};
  Object.entries(mix).forEach(([ck,pct])=>{
    let share=pct/100; baseShare+=share;
    if(ck==="kids"&&b.activeSynergies.includes("sugarrush"))share*=1.8; // extra kids ON TOP of the crowd
    let best=0,sumT=0;const tw={};
    menu.forEach(rk=>{
      const price=opts.prices?opts.prices[rk]:menuPrice(rk);
      let pf=priceFactor(payWillingness(ck,b,useWx),price);
      if(S.gear.includes("pricetag")&&(Math.abs(price%1)<0.01||Math.abs(price%1-0.5)<0.01))pf*=1.1;
      best=Math.max(best,appealFor(ck,rk,b)*pf*RECIPES[rk].appeal);
      const ap=appealFor(ck,rk,b); tw[rk]=ap*ap*ap*RECIPES[rk].appeal; sumT+=tw[rk];
    });
    weighted+=share*best;
    menu.forEach(rk=>{split[rk]=(split[rk]||0)+share*(sumT>0?tw[rk]/sumT:0)});
  });
  const priceAppeal=weighted/Math.max(baseShare,0.01);
  let demand=trafficBase*repMult*wxMult*signBonus*priceAppeal*b.demandMult*iceAccept();
  if(S.gear.includes("chalkmenu")&&menu.every(rk=>menuPrice(rk)>=3))demand*=1.2;
  if(S.gear.includes("thermo"))demand*=clamp(1+0.02*(M.temp-75),0.6,1.8);
  if(M.dice)demand*=M.dice;
  if(M.event&&M.event.id==="closure")demand*=0.35;
  if(M.event&&M.event.id==="heatwave")demand*=1.5;
  if(M.event&&M.event.id==="bees")demand*=0.8;
  if(M.event&&M.event.id==="puppy")demand*=1.15;
  if(M.event&&M.event.id==="newspaper")demand*=1.2;
  if(M.event&&M.event.id==="birthday")demand*=1.25;
  if(M.event&&M.event.id==="foodtruck")demand*=1.2;
  const minPrice=Math.min(...menu.map(rk=>menuPrice(rk)));
  const crew=!opts.noCrew&&M.event&&M.event.id==="crewbuy"&&minPrice<=CREW_MAX_PRICE+1e-9?crewSize():0;
  return {demand:Math.max(0,Math.round(demand))+crew,crew,wxMult,signBonus,priceAppeal,repMult,split};
}

const hudCash={shown:null,raf:0};
function showCash(to){
  const el=$("#hudCash"),box=$("#hudMoney"),from=hudCash.shown;
  el.classList.toggle("neg",to<5);
  if(from===to)return;
  cancelAnimationFrame(hudCash.raf);
  if(from===null||matchMedia("(prefers-reduced-motion:reduce)").matches){hudCash.shown=to;el.textContent=fmt(to);return}
  box.classList.remove("up","down");void box.offsetWidth;box.classList.add(to>from?"up":"down"); // restart the flash
  const whole=from%1===0&&to%1===0,t0=performance.now(),dur=300; // whole dollars count in whole dollars
  const step=t=>{const p=Math.min(1,(t-t0)/dur),v=p<1?from+(to-from)*(1-Math.pow(1-p,3)):to;
    hudCash.shown=v;el.textContent=fmt(whole?Math.round(v):v);if(p<1)hudCash.raf=requestAnimationFrame(step)};
  hudCash.raf=requestAnimationFrame(step);
}

  M.prices[rk]=S.menuPrices[rk]=v;sfx.tick();morningParts();
}
/* Today's menu: flavors you have supplies for. A flavor missing an ingredient sits out until you buy it. */
function sellableNow(){return S.recipes.filter(rk=>canBrew(rk,S.inv))}
function missingFor(rk){return listWords(Object.entries(pitcherNeeds(rk)).filter(([k,v])=>(S.inv[k]||0)<v).map(([k])=>`${iconHtml("supply",k)} ${INGREDIENTS[k].name.toLowerCase()}`))}
/* Cups a stock of supplies can still pour: brew any flavor you can make until nothing brews. */
function brewableServings(inv){let n=0,guard=0;while(guard++<300){const rk=S.recipes.find(r=>canBrew(r,inv));if(!rk)break;Object.entries(pitcherNeeds(rk)).forEach(([k,v])=>inv[k]-=v);n+=pitcherServes()}return n}
function cupsFromSupplies(){return Math.min(brewableServings({...S.inv}),S.inv.cups||0,M.icePerCup>0?Math.floor((S.inv.ice||0)/M.icePerCup):Infinity)}
function renderProj(){
  const gt=$("#guessText");if(!gt)return;
  const wx=WEATHERS[M.shownWx];

/* ---------- Day resolution ---------- */
let D=null; // day state
const MORNING_SHARE=0.55;
/* How much more can still be poured: open pitchers + what stock can still brew (cups cap it). */
function servingsReady(){
  let open=0;Object.values(D.open).forEach(v=>open+=v);
  return Math.min(S.inv.cups,open+brewableServings({...S.inv}));
}
function standDry(){return servingsReady()<=0}
function cheapestFlavor(){return D.menu.reduce((a,bk)=>menuPrice(bk)<menuPrice(a)?bk:a,D.menu[0])}
function brewPitcher(rk){
  if(!canBrew(rk,S.inv))return false;
  S.brewCount=(S.brewCount||0)+1;
  const freePitcher=S.gear.includes("pitcher")&&S.brewCount%4===0; // Grandma's Pitcher: every 4th is on her
  if(freePitcher)logLine(`<span class="good">🏺 Grandma's Pitcher: this pitcher is free.</span>`);
  else Object.entries(pitcherNeeds(rk)).forEach(([k,v])=>{S.inv[k]-=v});
  let servings=pitcherServes();
  if(S.gear.includes("brother")&&!D.brotherSpilled){D.brotherSpilled=true;servings-=2;logLine(`<span class="bad">👦 Little Brother spilled 2 cups.</span>`)}
  D.open[rk]=servings;D.brewed[rk]=(D.brewed[rk]||0)+1;
  return true;
}
/* One customer, one cup. Returns sold | price | warm | out. */
function serveOne(ck){
  const b=D.build;
  if(S.inv.cups<=0)return "out";
  if(M.icePerCup>0&&S.inv.ice<M.icePerCup)return "out";
  if(iceAccept()<1&&Math.random()>iceAccept())return "warm";
  let rk;const isCrew=D.crewLeft>0;
  if(isCrew){rk=cheapestFlavor()}
  else{
    let sum=0;const w={};
    D.menu.forEach(r=>{const ap=appealFor(ck,r,b);w[r]=ap*ap*ap*RECIPES[r].appeal;sum+=w[r]}); // taste cubed: preference decides the order
    let roll=Math.random()*sum;rk=D.menu[0];
    for(const r of D.menu){roll-=w[r];if(roll<=0){rk=r;break}}
    // price acceptance uses the same curve as the demand estimate, so projections stay honest:
    // at or under their willingness they always buy; far above it, most walk — after one re-pick.
    const will=payWillingness(ck,b,M.actualWx);
    const tryBuy=r=>Math.random()<Math.min(1,priceFactor(will,menuPrice(r)));
    if(!tryBuy(rk)){
      const alt=D.menu.filter(r2=>r2!==rk).sort((x,y)=>appealFor(ck,y,b)-appealFor(ck,x,b))[0];
      if(alt&&tryBuy(alt))rk=alt; else return "price";
    }
  }
  if(!D.open[rk]||D.open[rk]<=0){
    if(!brewPitcher(rk)){
      const alt=D.menu.filter(r2=>r2!==rk&&((D.open[r2]||0)>0||canBrew(r2,S.inv))).sort((x,y)=>appealFor(ck,y,b)-appealFor(ck,x,b))[0];
      if(!alt)return "out";
      rk=alt;
      if((!D.open[rk]||D.open[rk]<=0)&&!brewPitcher(rk))return "out";
    }
  }
  D.open[rk]--;S.inv.cups--;S.inv.ice=Math.max(0,S.inv.ice-M.icePerCup);
  const rev=saleRevenue(1,menuPrice(rk),rk);
  D.revenue+=rev;D.revBy[rk]=(D.revBy[rk]||0)+rev;D.tips+=rev*tipRate()*Math.random();
  D.cogs+=servingCost(rk);
  D.sold++;D.soldBy[rk]=(D.soldBy[rk]||0)+1;
  if(D.crewLeft>0)D.crewLeft--;
  return "sold";
}
function openStand(){
  if(!M.loc){alert("Pick a spot first.");return}
  const b=computeBuild();
  const putOut=Math.min(M.signs,S.inv.signs||0); // signs come from stock you already paid for — starting the day never charges you
  S.last={signs:putOut,ice:M.icePerCup};
  S.recipes.forEach(rk=>{S.menuPrices[rk]=M.prices[rk]});
  sfx.pop();
  M.actualWx=M.trueWx;
  D={signs:putOut,build:b,
     roll:rnd(0.87,1.13),open:{},brewed:{},soldBy:{},sold:0,morningSold:0,unmet:0,
     awayPrice:0,awayWarm:0,awayOut:0,revenue:0,revBy:{},tips:0,cogs:0,
     skip:false,done:false,brotherSpilled:false,crewLeft:0};
  const canSell=sellableNow();D.menu=canSell.length?canSell:S.recipes.slice(); // only flavors you have supplies for
  const minPrice=Math.min(...D.menu.map(rk=>menuPrice(rk)));
  D.crew=M.event&&M.event.id==="crewbuy"&&minPrice<=CREW_MAX_PRICE+1e-9?crewSize():0;
  D.crewLeft=D.crew;
  let full=demandEstimate(M.loc,putOut,{wx:M.actualWx,noCrew:true,menu:D.menu}).demand;
  full=Math.round(full*D.roll);
  D.morningDemand=Math.round(full*MORNING_SHARE)+D.crew;
  D.aftDemand=full-Math.round(full*MORNING_SHARE);
  D.demand=D.morningDemand+D.aftDemand;
  renderDayScene();
  runDayPhase("morning");
}
function renderDayScene(){
  $("#screen").innerHTML=`
  <div class="scene">
    <div class="sky ${M.actualWx}" id="skyBox">
      <div class="crowdMix">${iconHtml("spot",M.loc.name)} ${M.loc.name}<br>${crowdMixLine()}</div>
      ${skyArt(M.actualWx)}
      <div class="sceneBtns"><button class="btn sm ghost" onclick="D.skip=true">⏩ Skip</button> ${spdBtnHtml()}</div>
      <div class="standSign">🍋 ${D.menu.length} ${plural(D.menu.length,"flavor")}, from ${fmt(Math.min(...D.menu.map(rk=>menuPrice(rk))))}</div>
      <img class="stand" src="${STAND_PNG}" alt="">
      <div id="fxLayer"></div>
    </div>
    <div class="ground"></div>
    <div class="dayStats">

function crowdMixLine(){const mix=crowdMixFor(M.loc);return Object.entries(mix).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${CROWDS[k].icon} ${v}%`).join(", ")}
function logLine(html){const el=$("#dayLog");if(el){el.innerHTML+=html+"<br>";el.scrollTop=el.scrollHeight} S.log.push(html)}
function sleep(ms){ // simulation-time wait: scales with SPEED, live, and Skip ends it now
  return new Promise(res=>{
    if(D&&D.skip)return res();
    let acc=0,last=performance.now();
    const iv=setInterval(()=>{
      if(D&&D.skip){clearInterval(iv);return res()}
      const now=performance.now();acc+=(now-last)*SPEED;last=now;
      if(acc>=ms){clearInterval(iv);res()}
    },40);
  });
}
function specialBonus(rk){return S.gear.includes("special")&&M&&M.special===rk?0.5:0}
function saleRevenue(n,price,rk){
  let rev=n*price;
  if(S.gear.includes("zester")&&rk&&RECIPES[rk].tags.includes("SOUR"))rev+=n*0.50;
  if(rk)rev+=n*specialBonus(rk);
  return rev;
}
function tipRate(){
  let r=0.06*computeBuild().tipMult*(M.event&&M.event.id==="newspaper"?1.5:1);
  if(M.actualWx==="perfect")r*=1.6;
  return r;
}
async function runDayPhase(phase){
  const isMorning=phase==="morning";
  const target=isMorning?D.morningDemand:D.unmet+D.aftDemand;
  if(isMorning&&D.crew)logLine(`<span class="good">🚧 ${D.crew} road workers buy your cheapest flavor.</span>`);
  const mix=crowdMixFor(M.loc);
  const mixArr=[];Object.entries(mix).forEach(([k,v])=>{for(let i=0;i<v;i++)mixArr.push(k)});
  let streak=0,processed=0,dry=false;
  const visual=Math.min(Math.max(target,1),12);
  const chunk=Math.max(1,Math.ceil(target/Math.max(visual,1)));
  for(let i=0;i<visual&&processed<target;i++){
    const ck=pick(mixArr)||"parents";const c=CROWDS[ck];
    let soldChunk=0,miss=null;
    for(let j=0;j<chunk&&processed<target;j++){
      const res=serveOne(ck);
      processed++;
      if(res==="sold"){soldChunk++;streak++}
      else if(res==="price"){D.awayPrice++;streak=0;miss="too pricey…"}
      else if(res==="warm"){D.awayWarm++;streak=0;miss=`too warm… ${iconHtml("supply","ice")}`}
      else { // out of stock: the rest of this phase's line can't be served
        if(isMorning){D.unmet+=target-processed}
        else D.awayOut+=target-processed;
        processed=target;dry=true;break;
      }
    }
    if(!D.skip)spawnCustomer(ck,soldChunk>0?{buys:true,streak,say:Math.random()<0.24?c.line:null}:{say:miss});
    updateDayStats();
    if(dry)break;
    await sleep(rnd(450,750));
  }
  if(dry&&(isMorning?D.unmet>0:D.awayOut>0))logLine(`<span class="bad">${iconHtml("supply","cups")} You ran out of supplies.${isMorning?" People in line will wait until noon.":""}</span>`);
  if(!isMorning){await buyersServed();finishDay();return}
  D.morningSold=D.sold;
  if(standDry()){await buyersServed();finishDay();return}
  const msg=$("#dayMsg");if(msg)msg.textContent="Noon. More people are coming.";
  if(D.skip)resumeAfternoon();else after(900,resumeAfternoon);
}
function updateDayStats(){
  const st=$("#stStock");if(!st)return;
  st.textContent=servingsReady();
  $("#stTill").textContent=fmt(D.revenue+D.tips);
  showCash(S.cash+D.revenue+D.tips); // the HUD counts up with each sale; the evening adds bonuses on top
  $("#stDem").textContent=Math.max(0,D.demand-D.sold-D.awayPrice-D.awayWarm-D.awayOut);
}
/* Customers walk across the scene. Buyers stop at the counter and face you while they pay,
   then walk on with a cup; everyone else walks past, saying why as they pass the stand. */
const WALK_SPEED=75; // sprite pixels a second, so phones and desktops walk at the same pace
function spawnCustomer(ck,{buys=false,say=null,streak=0}={}){
  const sky=$("#skyBox");if(!sky)return;
  const day=D,d=document.createElement("div"),fw=ck==="parents"?32:24,fromLeft=Math.random()<0.5;
  const walkLook=carry=>{d.className=`cust ${carry?"carry":"walk"}${fromLeft?"":" left"}`;d.style.backgroundImage=`url(${CUSTOMER_WALK_PNG[ck]})`};
  d.style.setProperty("--fw",fw);walkLook(false);sky.appendChild(d);
  const W=sky.clientWidth,w=d.offsetWidth,speed=WALK_SPEED*(w/fw)/1000; // px per ms at 1×
  const from=fromLeft?-w:W+w,to=fromLeft?W+w:-w;
  const walk=(a,b)=>{ // duration is authored at 1×; playbackRate carries the live speed
    const anim=d.animate([{left:a+"px"},{left:b+"px"}],{duration:Math.abs(b-a)/speed,fill:"forwards"});
    anim.playbackRate=SPEED;liveAnims.add(anim);
    anim.finished.finally(()=>liveAnims.delete(anim));
    return anim.finished;
  };
  if(!buys){
    walk(from,to).then(()=>d.remove());
    if(say)after(Math.abs(W/2-from)/speed,()=>spawnBubble(say,d)); // talk as they pass the stand
    return;
  }
  const standW=($(".stand")||d).offsetWidth,spot=W/2+(Math.random()-0.5)*standW*0.7;
  day.buying=(day.buying||0)+1;
  walk(from,spot).then(()=>{
    if(!d.isConnected){day.buying--;return}
    d.className="cust front";d.style.backgroundImage=`url(${CUSTOMER_PNG[ck]})`;
    sfx.coin(streak);spawnCoin(spot);
    if(say)after(700,()=>spawnBubble(say,d)); // pay first, then talk, so the coin and bubble don't overlap
    after(800,()=>{day.buying--;if(!d.isConnected)return;walkLook(true);walk(spot,to).then(()=>d.remove())});
  });
}
/* Before the report, let buyers who are on their way finish buying. */
async function buyersServed(){
  let waited=0; // in simulation ms, so the grace period scales with SPEED too
  while(D&&D.buying>0&&!D.skip&&waited<5000){await sleep(100);waited+=100}
}
/* One speech bubble at a time, sitting above the customer who is talking
   and following them as they walk. If someone else is mid-sentence, the
   new line is dropped instead of stacking. Anchoring above the head also
   keeps bubbles clear of the stand sign, which hangs higher. */
let bubbleNow=null;
function spawnBubble(txt,anchor){
  const sky=$("#skyBox");if(!sky||!anchor||!anchor.isConnected)return;
  if(bubbleNow&&bubbleNow.isConnected)return; // one at a time: drop extras
  const d=document.createElement("div");d.className="bubble";d.innerHTML=txt; // the game's own lines, some with an icon
  sky.appendChild(d);bubbleNow=d;
  const place=()=>{
    if(!d.isConnected||!anchor.isConnected)return;
    const r=anchor.getBoundingClientRect(),sr=sky.getBoundingClientRect();
    const half=d.offsetWidth/2,cx=r.left+r.width/2-sr.left;
    d.style.left=Math.max(half+2,Math.min(sr.width-half-2,cx))+"px";
    d.style.bottom=(sr.bottom-r.top+4)+"px"; // just above the speaker's head
  };
  place();
  const iv=setInterval(place,40);
  after(1600,()=>{clearInterval(iv);d.remove();if(bubbleNow===d)bubbleNow=null});
}
function spawnCoin(x){
  const layer=$("#fxLayer");if(!layer)return;
  const d=document.createElement("div");d.className="coin";
  d.style.left=x+"px";layer.appendChild(d);after(800,()=>d.remove());
}
function resumeAfternoon(){if(!D||D.done)return;const msg=$("#dayMsg");if(msg)msg.textContent="Afternoon rush…";runDayPhase("afternoon")}

/* ---------- Evening: report, draft, quotas ---------- */
function finishDay(){
  if(D.done)return;D.done=true;
  const wasted=Object.values(D.open).reduce((s,v)=>s+v,0);
  const readyLeft=servingsReady();
  const soldOut=readyLeft<=0&&D.sold>0;
  // how many of the people who came got lemonade; leftover supplies keep for tomorrow, so they never count against you
  const served=D.demand>0?D.sold/D.demand:1;
  const unserved=Math.max(0,D.demand-D.sold);
  // money is shown in cents, so the day's total is built from cent-rounded parts: the report's rows always add up exactly
  let revenue=Math.round(D.revenue*100)/100, tips=Math.round(D.tips*100)/100;
  const pourCost=D.sold>0?D.cogs/D.sold:servingCost(S.recipes[0]);
  let bannerBonus=0;
  if(S.gear.includes("selloutbanner")&&soldOut&&unserved>0){bannerBonus=Math.min(unserved,D.sold);revenue+=bannerBonus}
  const totalIn=revenue+tips;
  const made=Math.round(totalIn*100)/100; // money made today: sales and tips (supplies — signs included — were paid for when bought)
  S.cash+=totalIn;S.cash=Math.round(S.cash*100)/100;
  S.lifetimeProfit+=made;S.lifetimeSold+=D.sold;

    repDelta+=step;repNotes.push(`${D.sold} of ${D.demand} ${plural(D.demand,"person","people")} got lemonade${step?` ${step>0?"+":"−"}${Math.abs(step)}`:""}`)}
  const avgPrice=D.sold>0?Object.entries(D.soldBy).reduce((s,[rk,n])=>s+menuPrice(rk)*n,0)/D.sold:0;
  if(S.gear.includes("chalk")&&D.signs+D.build.freeSigns>=4){repDelta+=0.2;repNotes.push("chalk art +0.2")}
  if(S.gear.includes("mascot")&&served<0.75){repDelta-=0.1;repNotes.push("mascot suit −0.1")}
  if(M.event&&M.event.id==="critic"){
    if(served>=0.9){repDelta+=0.5;repNotes.push("the critic loved it +0.5")}
    else if(served<0.5){repDelta-=0.5;repNotes.push("the critic didn't like it −0.5")}
  }
  const repBefore=S.rep;
  S.rep=clamp(Math.round((S.rep+repDelta)*10)/10,1,5);
  // perfect day: everyone served, nothing poured out
  const perfect=unserved===0&&wasted===0&&D.sold>0&&made>0;
  if(perfect){S.perfectDays++;after(250,()=>{confetti(70);sfx.fanfare()})}
  else if(made>20){sfx.good()} else if(made<0){sfx.bad()}
  // HOT STREAK: serve 3 of 4 customers and make money, and the day chains.
  let streakNote="";
  if(served>=0.75&&made>0){
    S.streak++;S.bestStreak=Math.max(S.bestStreak,S.streak);
    if(S.streak>=2){const pct=Math.min(25,3*S.streak);const bonus=Math.round(revenue*pct/100*100)/100;S.cash+=bonus;S.lifetimeProfit+=bonus;streakNote=`🔥 Hot streak: ${S.streak} ${plural(S.streak,"day")} in a row. Bonus: <b>${fmt(bonus)}</b> (${pct}% of sales).`}
  } else if(S.gear.includes("clover")&&S.streak>=2&&S.cloverAct!==actIndex()){

  } else {

    S.streak=0;
  }
  // Compound Piggy: interest on the bank, every evening
  let interestNote="";
  if(S.gear.includes("piggy")){const interest=Math.min(200,Math.floor(Math.max(0,S.cash-150)*0.04));if(interest>0){S.cash+=interest;S.lifetimeProfit+=interest;interestNote=`🐷 Piggy bank interest: +<b>${fmt(interest)}</b>.`}}

    if(["sunny","hot","perfect"].includes(M.actualWx)&&made>0){const add=Math.round(made*0.15*100)/100;S.jar=Math.round(((S.jar||0)+add)*100)/100;jarNote=`🌦️ Rainy-Day Jar: +${fmt(add)} saved (${fmt(S.jar)} in the jar).`}
    else if(["cloudy","rainy"].includes(M.actualWx)&&S.jar>0){S.cash+=S.jar;S.lifetimeProfit+=S.jar;jarNote=`🌦️ Rainy-Day Jar pays out <b>${fmt(S.jar)}</b>.`;S.jar=0}
  }
  S.cash=Math.round(S.cash*100)/100;
  // counterfactual — the near-miss engine
  let counter="";const outCount=Math.max(0,unserved-D.awayPrice-D.awayWarm); // left because supplies ran out
  if(unserved>0&&(D.awayOut>0||D.unmet>0))counter=`You ran out. ${outCount} more ${plural(outCount,"person","people")} wanted lemonade. That's about <b>${fmt(outCount*Math.max(avgPrice,1))}</b> you missed. Buy more supplies.`;
  else if(D.awayPrice>unserved*0.4&&D.awayPrice>0)counter=`${D.awayPrice} ${plural(D.awayPrice,"person","people")} walked away. The price was too high. Try a lower price.`;

  else counter=`Everyone got lemonade, and nothing went to waste.`;
  const tonight=overnight(); // ice melts and old produce goes bad once you close
  const byCups=Object.entries(D.soldBy).sort((a,b2)=>b2[1]-a[1]);
  const sellRows=byCups.map(([rk,n])=>`<div class="rRow"><span><span tabindex="0"${tip(RECIPES[rk].name)}>${iconHtml("flavor",rk)}</span> ${n} ${plural(n,"cup")} at ${fmt(menuPrice(rk))}</span><span class="amt">${fmt(n*menuPrice(rk))}</span></div>`).join("");
  const upgradeBonus=Math.round((D.revenue-Object.entries(D.soldBy).reduce((s,[rk,n])=>s+n*menuPrice(rk),0))*100)/100;
  const walked=D.awayPrice,warmAway=D.awayWarm,ranOut=Math.max(0,unserved-walked-warmAway),why=[];
  if(ranOut)why.push(`${ranOut} left because you ran out`);if(walked)why.push(`${walked} said it cost too much`);if(warmAway)why.push(`${warmAway} wanted more ice`);
  const brewedTotal=Object.values(D.brewed).reduce((s,v)=>s+v,0);
  const invLine=Object.keys(INGREDIENTS).filter(id=>(S.inv[id]||0)>0).map(id=>`${S.inv[id]}${iconHtml("supply",id)}`).join(" ");
  const repExtra=repNotes.slice(D.demand>0?1:0); // the first note (people served) is the line above it
  const repLine=repNotes.length?`⭐ Stars: ${repBefore.toFixed(1)} → <b>${S.rep.toFixed(1)}</b>${repExtra.length?` (${repExtra.join(", ")})`:""}`:`⭐ Stars: <b>${S.rep.toFixed(1)}</b> (no change)`;
  const stamp=perfect?`<span class="rStamp">Perfect day</span>`:soldOut?`<span class="rStamp">Sold out</span>`:made<0?`<span class="rStamp bad">Rough day</span>`:"";
  const today=S.log.slice(M.logStart);
  $("#screen").innerHTML=`
  <div class="panel">
    <h2>🌇 Day ${S.day} results</h2>
    <div class="report">
      <div class="receiptBox">
        <div class="receiptWrap"><div class="receipt">
          <div class="rHead">${iconHtml("spot",M.loc.name)} ${M.loc.name}</div>
          ${sellRows}
          ${upgradeBonus>0.004?`<div class="rRow"><span>🎁 Upgrade bonuses</span><span class="amt">+${fmt(upgradeBonus)}</span></div>`:""}
          ${bannerBonus?`<div class="rRow"><span>🚩 Sellout Banner pre-sales</span><span class="amt">+${fmt(bannerBonus)}</span></div>`:""}
          <div class="rRow"><span>🫙 Tips</span><span class="amt">+${fmt(tips)}</span></div>
          <div class="rTotal"><span>Money made today</span><span class="coinSpot"><span class="amt ${made>=0?"pos":"negc"}" id="madeAmt">${fmt(made)}</span></span></div>
          ${stamp}
        </div></div>
      </div>
      <div class="dayNotes">
        <p>👥 ${D.sold} of ${D.demand} ${plural(D.demand,"person","people")} got lemonade.${why.length?` ${why.join(", ")}.`:""}</p>
        <div class="note">${counter}</div>
        <p>${repLine}</p>
        ${[streakNote,interestNote,jarNote].filter(Boolean).map(n=>`<p>${n}</p>`).join("")}
        ${tonight.length?`<p>🌙 Tonight: ${listWords(tonight)}.</p>`:""}
      </div>
    </div>
    <details class="numbers"><summary>See every number</summary>
      <ul class="facts">
        ${byCups.map(([rk,n])=>`<li>${iconHtml("flavor",rk)} ${RECIPES[rk].name}: <b>${n} ${plural(n,"cup")}</b></li>`).join("")}
        <li>🍶 Pitchers made: <b>${brewedTotal}</b></li>
        ${wasted?`<li>🫗 Cups poured out: <b>${wasted}</b></li>`:""}
        <li>🎒 Supplies left: <b>${invLine||"none"}</b></li>
      </ul>
      <h4 class="todayHead">Today</h4>
      <ul class="facts">${today.length?today.map(l=>`<li>${l}</li>`).join(""):"<li>A quiet day at the stand.</li>"}</ul>
    </details>
    <div class="center mt"><button class="btn gold" style="font-size:21px" onclick="afterReport()">${S.day%3===0?"📦 Open your bonus crate →":"🎁 Pick an upgrade →"}</button></div>
  </div>`;
  countUp($("#madeAmt"),made);
  updateHUD();
  D.report={profit:made,perfect};
}
function afterReport(){
  if(S.cash<cheapestServingCost()&&S.cash<1){endRun("bankrupt","You don't have enough money to make a cup.");return}
  offerDraft();
}
/* ---------- Drafts & crates ---------- */
let draftChoices=[],draftTitle="",pendingDraft=null;
function buildDraftPool(rareOnly){
  const pool=[];
  GEAR.forEach(g=>{if(!S.gear.includes(g.id)&&(!rareOnly||["rare","epic","legendary"].includes(g.rar)))pool.push({kind:"gear",id:g.id,w:g.rar==="legendary"?2:g.rar==="epic"?4:g.rar==="rare"?7:10})});
  Object.keys(RECIPES).forEach(rk=>{if(!S.recipes.includes(rk))pool.push({kind:"recipe",id:rk,w:8})});
  pool.push({kind:"cash",id:"cash",w:5});
  // tag-weighted drafting: recipes sharing tags you already serve come up more (synergy must stay findable)
  const b=computeBuild();
  pool.forEach(p=>{if(p.kind==="recipe")RECIPES[p.id].tags.forEach(t=>{if(b.tags[t])p.w*=1.5})});
  // late game: commons fade, the pool heats up — progression shouldn't taper just as rents spike
  if(actIndex()>=2)pool.forEach(p=>{if(p.kind==="gear"){const g=GEAR.find(x=>x.id===p.id);if(g&&g.rar==="common")p.w*=0.4}});
  return pool;
}
function drawDraft(rareOnly){
  const pool=buildDraftPool(rareOnly);const out=[];const used=new Set();
  while(out.length<3&&pool.length){
    const c=sampleWeighted(pool.filter(p=>!used.has(p.kind+":"+p.id)).map(p=>({k:p,w:p.w})));
    if(!c)break;used.add(c.k.kind+":"+c.k.id);out.push(c.k);
  }
  return out;
}
function draftCardHtml(p){
  if(p.kind==="gear"){const g=GEAR.find(x=>x.id===p.id);const full=S.gear.length>=gearSlots();
    return {icon:gearIconHtml(g.id,true),title:g.name,badge:rarBadge(g.rar),desc:g.desc+(full?`<br><b class="warn">Your stand is full. You'll swap one out.</b>`:""),tags:"",type:"Stand upgrade"}}
  if(p.kind==="recipe"){const r=RECIPES[p.id];const needs=Object.entries(pitcherNeeds(p.id)).map(([k,v])=>v+iconHtml("supply",k)).join(" ");
    return {icon:iconHtml("flavor",p.id,true),title:r.name,badge:"",desc:`${r.desc} Liked by ${flavorFans(r.tags)}. Each pitcher needs ${needs}.`,tags:tagChips(r.tags),type:"New flavor"}}
  return {icon:"💵",title:"Cousin's Gift",badge:"",desc:`+${fmt(18+22*actIndex())} cash right now. It gets bigger later in the summer.`,tags:"",type:"Cash"};
}
function renderDraftScreen(){
  $("#screen").innerHTML=`<div class="panel">
    <h2>${draftTitle}</h2>
    <p class="muted" style="margin-top:0">It starts working tomorrow. The other two go away.</p>
    ${shelfHtml()}
    <div class="choices">${draftChoices.map((p,i)=>{const c=draftCardHtml(p);return `<button class="choice" onclick="pickDraft(${i})"><div class="ttl"><span>${c.icon} ${c.title}</span>${c.badge}</div><div class="small typeLabel">${c.type}</div><div class="desc">${c.desc}</div>${c.tags}</button>`}).join("")}</div>
  </div>`;
}
function offerDraft(){
  if(S.day%3===0){offerCrate();return}
  draftChoices=drawDraft(false);sfx.flip();
  draftTitle="🎁 Pick an upgrade";
  renderDraftScreen();
}
function offerCrate(){
  $("#screen").innerHTML=`<div class="panel center">
    <h2>📦 Bonus crate</h2>
    <p class="big">Every 3rd day you get a free crate. Which one?</p>
    <div class="choices">
      <button class="choice" onclick="openCrate('gear')"><div class="ttl"><span>🧰 Upgrade crate</span></div><div class="desc">3 rare (or better) stand upgrades.</div></button>
      <button class="choice" onclick="openCrate('recipe')"><div class="ttl"><span>🍋 Flavor crate</span></div><div class="desc">3 new flavors.</div></button>
      <button class="choice" onclick="openCrate('wild')"><div class="ttl"><span>🎲 Surprise crate</span></div><div class="desc">3 of anything: upgrades, flavors or cash.</div></button>
    </div></div>`;
}
function openCrate(kind,title){
  sfx.flip();confetti(25);
  let pool;
  if(kind==="gear")pool=GEAR.filter(g=>!S.gear.includes(g.id)&&["rare","epic","legendary"].includes(g.rar)).map(g=>({kind:"gear",id:g.id,w:5}));
  else if(kind==="recipe")pool=Object.keys(RECIPES).filter(rk=>!S.recipes.includes(rk)).map(rk=>({kind:"recipe",id:rk,w:5}));
  else pool=buildDraftPool(false);
  draftChoices=[];const used=new Set();
  const add=list=>{for(const p of shuffle(list)){if(draftChoices.length>=3)break;const key=p.kind+":"+p.id;if(used.has(key))continue;used.add(key);draftChoices.push(p)}};
  add(pool);
  if(draftChoices.length<3)add(buildDraftPool(true)); // crate ran thin — top it up with other rare loot
  if(!draftChoices.length){draftChoices=[{kind:"cash",id:"cash"}]}
  draftTitle=title||"📦 Bonus crate: pick one";
  renderDraftScreen();
}
function pickDraft(i){
  const p=draftChoices[i];if(!p)return;
  if(p.kind==="gear"&&S.gear.length>=gearSlots()){showSwap(p);return}
  grantDraft(p);
}
/* Gear slots are full: the new piece only comes in if an old one goes out. */
function showSwap(p){
  pendingDraft=p;sfx.flip();
  const c=draftCardHtml(p);
  const owned=S.gear.map(id=>GEAR.find(x=>x.id===id));
  $("#screen").innerHTML=`<div class="panel">
    <h2>🧰 Your stand is full</h2>
    <p style="margin-top:0">Which upgrade should go? You'll get <b>${gearIconHtml(p.id)} ${c.title}</b>.</p>
    <div class="choices">${owned.map((o,i)=>`<button class="choice" onclick="swapFor(${i})"><div class="ttl"><span>${gearIconHtml(o.id,true)} ${o.name}</span>${rarBadge(o.rar)}</div><div class="small typeLabel">Remove</div><div class="desc">${o.desc}</div></button>`).join("")}</div>
    <div class="flex mt" style="justify-content:center"><button class="btn sm ghost" onclick="pendingDraft=null;renderDraftScreen()">← Back</button><button class="btn sm ghost" onclick="pendingDraft=null;nextDay()">Keep my stand</button></div>
  </div>`;
}
function swapFor(i){
  const p=pendingDraft;if(!p)return;pendingDraft=null;
  const g=GEAR.find(x=>x.id===S.gear[i]);S.gear.splice(i,1);S.log.push(`<span class="info">🔁 Swapped out ${gearIconHtml(g.id)} ${g.name}.</span>`);
  grantDraft(p);
}
function grantDraft(p){
  sfx.good();
  if(p.kind==="gear"){S.gear.push(p.id);if(p.id==="lemontree")S.treeDays=0;const g=GEAR.find(x=>x.id===p.id);S.log.push(`<span class="good">🎁 New upgrade: ${gearIconHtml(g.id)} ${g.name}</span>`)}
  if(p.kind==="recipe"){S.recipes.push(p.id);const r=RECIPES[p.id];S.log.push(`<span class="good">🎁 New flavor: ${iconHtml("flavor",p.id)} ${r.name}</span>`)}
  if(p.kind==="cash"){const amt=18+22*actIndex();S.cash+=amt;S.log.push(`<span class="good">🎁 Your cousin gave you ${fmt(amt)}.</span>`)}
  // synergy discovery check
  const b=computeBuild();const newOnes=b.synergies.filter(s=>!S.discoveredSyn.includes(s.id));
  if(newOnes.length){
    newOnes.forEach(s=>{S.discoveredSyn.push(s.id);if(!meta.discoveredSyn.includes(s.id))meta.discoveredSyn.push(s.id)});
    confetti(60);sfx.fanfare();
    $("#screen").innerHTML=`<div class="panel center"><div class="synBanner" style="font-size:23px">⚡ New combo ⚡</div>
      <h2 class="mt">${newOnes.map(s=>s.name).join(" + ")}</h2>
      <p class="big">${newOnes.map(s=>s.desc).join("<br>")}</p>
      <button class="btn gold" style="font-size:20px" onclick="nextDay()">Start Day ${S.day+1} →</button></div>`;
    saveMeta();updateHUD();return;
  }
  nextDay();
}
function nextDay(){
  S.day++;
  if(!S.endless&&S.day>S.totalDays){summerComplete();return}
  startMorning();
}
/* ---------- Summer complete / Endless ---------- */
function summerComplete(){
  S.completed=true;
  const best=Math.max(meta.stats.best,Math.round(S.cash));
  $("#screen").innerHTML=`<div class="panel center">
    <h2>🏆 Summer complete!</h2>
    ${scoreHtml(`Your best: ${fmt(best)}`)}
    ${highlightsHtml(clamp(S.day,0,14))}
    <div class="flex mt" style="justify-content:center;gap:10px;flex-wrap:wrap">
      <button class="btn gold" style="font-size:20px" onclick="endRun('complete')">🏁 Finish and keep my score</button>
      <button class="btn purple" style="font-size:20px" onclick="goEndless()">♾️ Keep playing (Endless)</button>
    </div>
    <p class="small muted">Endless: keep your stand and play on. Stop any morning, or play until you run out of money.</p>
  </div>`;
  countUp($("#scoreAmt"),S.cash);
  confetti(80);sfx.fanfare();updateHUD();
}
/* The score, big, then four highlights of the run. */
function scoreHtml(bestLine){
  return `<div class="scoreLabel">Your score</div><div class="coinSpot"><div class="scoreBig" id="scoreAmt">${fmt(S.cash)}</div></div><p class="muted" style="margin:2px 0 0">${bestLine}</p>`;
}
function highlightsHtml(days){
  const hl=[["📅",S.endless?days:`${days} of 14`,"days played"],["🥤",S.lifetimeSold,"cups sold"],
    ["🔥",`${S.bestStreak} ${plural(S.bestStreak,"day")}`,"best hot streak"],["⭐",S.perfectDays,`${plural(S.perfectDays,"perfect day")}`]];
  return `<ul class="highlights">${hl.map(([i,v,l])=>`<li><span class="hlIcon">${i}</span><b>${v}</b><small>${l}</small></li>`).join("")}</ul>`;
}
function goEndless(){
  S.endless=true;S.totalDays=Infinity;S.actsCount=Infinity;
  S.log.push(`<span class="info">♾️ Endless. Stop any morning to keep your score.</span>`);
  sfx.fanfare();startMorning();
}
/* ---------- Run end / meta ---------- */
function endRun(mode,reason){
  const daysSurvived=S.endless?S.day:clamp(S.day,0,14);
  const st=meta.stats;
  st.runs++;if(S.completed){st.wins++;st.winsFull++}
  st.days+=daysSurvived;st.sold+=S.lifetimeSold;st.profit+=Math.max(0,Math.round(S.lifetimeProfit));
  st.perfect+=S.perfectDays;st.sellouts+=S.sellouts;
  const prevBest=st.best;st.best=Math.max(st.best,Math.round(S.cash));
  saveMeta();
  const heading=mode==="complete"?"🏆 Summer complete!":mode==="retired"?"🏁 Score saved":"🌅 Out of business";
  if(mode!=="bankrupt"){confetti(120);sfx.fanfare()}
  const newBest=prevBest>0&&Math.round(S.cash)>prevBest;
  $("#screen").innerHTML=`<div class="panel center">
    <h2>${heading}</h2>
    ${S.endless&&S.completed?`<p class="muted" style="margin:2px 0">Summer complete, then Endless to Day ${S.day}.</p>`:""}
    ${reason?`<p class="big">${reason}</p>`:""}
    ${scoreHtml(newBest?"🏅 New best score!":`Your best: ${fmt(st.best)}`)}
    ${highlightsHtml(daysSurvived)}
    <p class="muted">Your stand: ${buildSummary()}</p>
    ${S.discoveredSyn.length?`<p class="muted">⚡ Combos found: ${S.discoveredSyn.map(id=>SYNERGIES.find(s=>s.id===id).name).join(", ")}</p>`:""}
    <div class="flex mt" style="justify-content:center">
      <button class="btn gold" style="font-size:21px" onclick="showTitle()">Play again</button>
    </div>
  </div>`;
  countUp($("#scoreAmt"),S.cash);
  updateHUD();
  S=null;setTimeout(updateHUD,50);$("#hud").style.display="none";
}
function buildSummary(){
  const parts=[];
  S.gear.forEach(gid=>{const g=GEAR.find(x=>x.id===gid);if(g)parts.push(gearIconHtml(g.id)+" "+g.name)});
  S.recipes.forEach(rk=>parts.push(iconHtml("flavor",rk)+" "+RECIPES[rk].name));
  return parts.length?parts.join(", "):"nothing yet.";
}
/* ---------- Modals: build + help ---------- */
function showBuild(){
  if(!S)return;
  const b=computeBuild(),empty=gearSlots()-S.gear.length;
  $("#modalRoot").innerHTML=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="flex spread"><h2>🧰 My Upgrades</h2><button class="btn sm ghost" onclick="closeModal()">✕ Close</button></div>
    <h3>My Stand (${S.gear.length}/${gearSlots()})</h3>
    <ul class="list">${S.gear.map(gid=>{const g=GEAR.find(x=>x.id===gid);return `<li><b>${gearIconHtml(g.id)} ${g.name}</b> ${rarBadge(g.rar)}<br><span class="small">${g.desc}</span></li>`}).join("")}${empty?`<li class="muted">${empty} empty ${plural(empty,"slot")}. You win upgrades after each day.</li>`:""}</ul>
    <h3>My flavors</h3>
    <ul class="list">${S.recipes.map(rk=>{const r=RECIPES[rk];return `<li><b>${iconHtml("flavor",rk)} ${r.name}</b> ${tagChips(r.tags)}<br><span class="small">Liked by ${flavorFans(r.tags)}</span></li>`}).join("")}</ul>
    <h3>⚡ Combos</h3>
    <p class="small muted" style="margin:0">The right mix of flavors on your menu gives a bonus.</p>
    <ul class="list">${SYNERGIES.map(s=>`<li>${b.activeSynergies.includes(s.id)?"✅":"🔒"} <b>${s.name}</b>: ${s.desc}</li>`).join("")}</ul>
  </div></div>`;
}
function showHelp(){
  $("#modalRoot").innerHTML=`<div class="modalWrap" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="flex spread"><h2>❓ How to play</h2><div class="flex"><button class="btn sm ghost" id="helpSound" onclick="toggleSound()">${soundOn?"🔊 Sound on":"🔇 Sound off"}</button><button class="btn sm ghost" onclick="closeModal()">✕ Close</button></div></div>
    <p style="margin:0 0 10px">Make as much money as you can in 14 days. The money you end with is your score.</p>
    ${howSteps()}
    <h3>Rules</h3>
    <ul class="list">
      <li>💰 Money made is your sales and tips. Supplies and signs are paid for when you buy them. Starting a day never costs money.</li>
      <li>💵 You start with $30. If you can't pay for one cup, the game ends.</li>
      <li>🌤️ The forecast is always right. Hot days bring more people. Rain brings fewer.</li>
      <li>🧊 Hot days need more ice. Under 70°F, no ice. In the 70s, 1 cube. In the 80s, 2. In the 90s, 3. At 100°F and up, 4.</li>
      <li>🛒 Bigger packs cost less for each one.</li>
      <li>🫠 Half of your leftover ice melts each night. Lemons last 7 days, cucumbers 5, mint 4 and strawberries 3.</li>
      <li>🪧 Signs bring in more customers. About 1 in 4 signs you put out breaks overnight.</li>
      <li>⭐ Stars go up when most people get lemonade. They go down when many people leave without any. More stars bring more people.</li>
      <li>🏷️ Flavor tags are Sweet, Sour, Fancy, Chilled and Fizzy. Each crowd likes different ones.</li>
      <li>👥 Kids like sweet drinks. Parents like fancy and sweet. Athletes like sour and chilled. Tourists like fancy. Foodies like fancy and sour. Artists like fancy and fizzy.</li>
      <li>⚡ Combos give a bonus when the right mix of flavors is on your menu.</li>
      <li>🔥 A hot streak gives a bonus each night. Serve 3 out of 4 customers and make money, day after day.</li>
      <li>💎 Upgrades can be common, rare, epic or legendary. Rarer ones show up less often.</li>
      <li>📦 Every 3rd day you get a bonus crate.</li>
      <li>♾️ Endless starts after day 14. Play as long as you like.</li>
    </ul>
    <p class="small muted">Point at or tap anything in the game to learn more.</p>
  </div></div>`;
}
function closeModal(){$("#modalRoot").innerHTML=""}
/* ---------- Tips: point at, focus or tap anything with data-tip to see what it means ---------- */
const tipBox=document.createElement("div");tipBox.id="tipBox";tipBox.setAttribute("role","tooltip");document.body.appendChild(tipBox);
let tipFor=null,tipAt=0;
const touchOnly=()=>matchMedia("(hover:none)").matches;
function showTip(el){
  const t=el.getAttribute("data-tip");if(!t){hideTip();return}
  tipFor=el;tipAt=performance.now();tipBox.textContent=t;tipBox.classList.add("on");
  const r=el.getBoundingClientRect(),w=tipBox.offsetWidth,h=tipBox.offsetHeight,pad=8;
  tipBox.style.left=Math.max(pad,Math.min(innerWidth-w-pad,r.left+r.width/2-w/2))+"px";
  tipBox.style.top=(r.top-h-8>=pad?r.top-h-8:r.bottom+8)+"px";
}
function hideTip(){tipFor=null;tipBox.classList.remove("on")}
document.addEventListener("mouseover",e=>{if(touchOnly())return;const el=e.target.closest("[data-tip]");if(el){if(el!==tipFor)showTip(el)}else if(tipFor)hideTip()});
document.addEventListener("focusin",e=>{if(touchOnly())return;const el=e.target.closest("[data-tip]");if(el)showTip(el)});
document.addEventListener("focusout",()=>{if(!touchOnly())hideTip()});
document.addEventListener("click",e=>{if(!touchOnly())return;const el=e.target.closest("[data-tip]");
  if(el&&!el.matches("button,input")){if(el===tipFor)hideTip();else showTip(el)}else hideTip()});
addEventListener("scroll",()=>{if(tipFor&&performance.now()-tipAt>250)hideTip()},{passive:true,capture:true}); // a tap can nudge the page; don't close the tip it just opened
$("#btnHelp").addEventListener("click",showHelp);
function toggleSound(){soundOn=!soundOn;$("#btnSound").classList.toggle("off",!soundOn);const h=$("#helpSound");if(h)h.textContent=soundOn?"🔊 Sound on":"🔇 Sound off";if(soundOn)sfx.pop()}
$("#btnSound").addEventListener("click",toggleSound);
showTitle();
</script>
</body>
</html>
